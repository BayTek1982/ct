/* ---- CT-Prinzip: Rotation ---- */
function objF(x,y){ // Bauteil-Schnitt (Zylinderkopf-artig)
  if(Math.abs(x)>0.62||Math.abs(y)>0.38)return 0;
  if((x+0.32)**2+(y)**2<0.13**2)return 0;
  if((x-0.05)**2+(y+0.1)**2<0.1**2)return 0;
  if((x-0.38)**2+(y-0.12)**2<0.09**2)return 0;
  return 1;
}
EXTRA.ct=(ex)=>{
  ex.innerHTML=`<div class="sec fx" style="--i:2">Animation · So entsteht ein CT</div>
  <div class="panel fx" style="--i:2"><div class="seg" id="mode" style="margin-bottom:10px"><button data-v="i" class="on">INDUSTRIE: BAUTEIL DREHT</button><button data-v="m">MEDIZIN: GANTRY DREHT</button></div>
  <canvas id="rot"></canvas><div class="hint" style="margin:8px 0 0">Rechts siehst du live das Detektorsignal (Projektion). Dicke Bereiche schwächen stärker → weniger Signal.</div></div>`;
  const c=document.getElementById('rot');let mode='i';const my=runId;let ang=0;
  document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#mode button').forEach(q=>q.classList.remove('on'));b.classList.add('on');mode=b.dataset.v;});
  let [x,w,h]=cvs(c,280);
  function loop(){
    if(my!==runId||!document.getElementById('rot'))return;
    ang+=0.012;
    x.clearRect(0,0,w,h);
    const cx=w*0.45,cy=h/2,sc=Math.min(w*0.22,h*0.32),Rs=Math.min(w*0.38,h*0.46);
    const ga=mode==='m'?ang:0, oa=mode==='i'?ang:0;
    const sx=cx-Math.cos(ga)*Rs, sy=cy-Math.sin(ga)*Rs;
    const dcx=cx+Math.cos(ga)*Rs*0.75, dcy=cy+Math.sin(ga)*Rs*0.75;
    const nx=-Math.sin(ga),ny=Math.cos(ga);const half=sc*1.25;
    // Fächer
    x.fillStyle='rgba(179,136,255,.08)';x.beginPath();x.moveTo(sx,sy);x.lineTo(dcx+nx*half,dcy+ny*half);x.lineTo(dcx-nx*half,dcy-ny*half);x.closePath();x.fill();
    x.strokeStyle='rgba(179,136,255,.4)';x.setLineDash([4,5]);x.stroke();x.setLineDash([]);
    // Objekt
    x.save();x.translate(cx,cy);x.rotate(oa);
    x.fillStyle='#9aa4b1';rr(x,-0.62*sc,-0.38*sc,1.24*sc,0.76*sc,8);x.fill();
    x.fillStyle='#05080d';[[-0.32,0,0.13],[0.05,-0.1,0.1],[0.38,0.12,0.09]].forEach(([a,b,r])=>{x.beginPath();x.arc(a*sc,b*sc,r*sc,0,7);x.fill();});
    x.restore();
    if(mode==='i'){x.strokeStyle=C.or;x.setLineDash([3,3]);x.beginPath();x.ellipse(cx,cy+sc*0.85,sc*0.7,sc*0.12,0,0,7);x.stroke();x.setLineDash([]);}
    // Projektion
    const N=60;const prof=[];
    for(let j=0;j<N;j++){
      const u=(j/(N-1)-0.5)*2;const dx=dcx+nx*half*u,dy=dcy+ny*half*u;
      let s=0;const steps=90;
      for(let k=0;k<steps;k++){const t=k/steps;const wx=sx+(dx-sx)*t,wy=sy+(dy-sy)*t;
        let ox=(wx-cx)/sc,oy=(wy-cy)/sc;const co=Math.cos(-oa),si=Math.sin(-oa);const rx=ox*co-oy*si,ry=ox*si+oy*co;s+=objF(rx,ry);}
      const len=Math.hypot(dx-sx,dy-sy)/sc/steps;prof.push(Math.exp(-s*len*1.6));
    }
    // Detektor
    x.strokeStyle=C.gr;x.lineWidth=5;x.shadowColor=C.gr;x.shadowBlur=8;x.beginPath();x.moveTo(dcx+nx*half,dcy+ny*half);x.lineTo(dcx-nx*half,dcy-ny*half);x.stroke();x.shadowBlur=0;x.lineWidth=1;
    // Profil am Detektor
    x.beginPath();prof.forEach((p,j)=>{const u=(j/(N-1)-0.5)*2;const bx=dcx+nx*half*u+Math.cos(ga)*(8+p*sc*0.45),by=dcy+ny*half*u+Math.sin(ga)*(8+p*sc*0.45);j?x.lineTo(bx,by):x.moveTo(bx,by);});
    x.strokeStyle=C.gr;x.lineWidth=2;x.shadowColor=C.gr;x.shadowBlur=6;x.stroke();x.shadowBlur=0;x.lineWidth=1;
    // Quelle
    x.fillStyle=C.gd;x.shadowColor=C.gd;x.shadowBlur=14;x.beginPath();x.arc(sx,sy,6,0,7);x.fill();x.shadowBlur=0;
    pillC(x,'QUELLE',sx+(mode==='i'?10:12),sy-18,C.gd,'l');
    pillC(x,'DETEKTOR',Math.min(dcx+8,w-80),Math.max(20,dcy-half-14),C.gr,'l');
    pillC(x,mode==='i'?'DREHTELLER':'BAUTEIL',cx,Math.min(h-12,cy+sc*0.85+20),C.or,'c');
    pillC(x,'WINKEL '+Math.round(((ang*180/Math.PI)%360))+'°',8,h-14,C.li,'l');
    requestAnimationFrame(loop);
  }
  loop();
};

/* ---- CT-Labor: Rekonstruktion ---- */
EXTRA.labor=(ex)=>{
  ex.innerHTML=`<div class="panel fx" style="--i:2"><h3>Rekonstruiere einen Gussteil-Schnitt</h3><div class="hint">Links das echte Bauteil (mit Kanälen, Poren und einem Eisen-Einschluss), in der Mitte das Sinogramm, rechts deine Rekonstruktion. Drücke START.</div>
  <div class="row3"><div class="cv"><canvas id="c0" width="128" height="128"></canvas><span class="cap" style="color:${V.gd}">ORIGINAL</span></div><div class="cv"><canvas id="c1" width="128" height="128"></canvas><span class="cap" style="color:${V.li}">SINOGRAMM</span></div><div class="cv"><canvas id="c2" width="128" height="128"></canvas><span class="cap" style="color:${V.gr}">ERGEBNIS</span></div></div>
  <div class="pills" id="lp"></div>
  <div class="ctl"><div><label>Anzahl Projektionen</label><div class="seg" id="na"><button data-v="8">8</button><button data-v="24">24</button><button data-v="90">90</button><button data-v="180" class="on">180</button></div></div>
  <div><label>Rampenfilter</label><div class="seg" id="fi"><button data-v="1" class="on">FILTER AN (FBP)</button><button data-v="0">FILTER AUS</button></div></div>
  <div><label>Rauschen</label><div class="seg" id="no"><button data-v="0" class="on">AUS</button><button data-v="1">AN</button></div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="go">▶ START</button><button class="btn ghost" id="rs">↺ ZURÜCKSETZEN</button></div></div></div>
  <div class="row2"><div class="panel fx" style="--i:3"><h3>Was du beobachten kannst</h3><div class="in"><ul><li>Mit <b>8 Projektionen</b> entstehen Streifen – zu wenig Information.</li><li><b>Filter aus</b>: Das Bild ist verschmiert, Poren verschwinden fast.</li><li><b>Rauschen an</b>: Kleine Poren sind schwerer zu erkennen.</li><li>Der helle <b>Einschluss</b> malt im Sinogramm eine helle Sinuskurve.</li></ul></div></div>
  <div class="panel fx" style="--i:4"><h3>Das passiert im Rechner</h3><div class="in"><p>Für jeden Winkel wird die Projektion gemessen (eine Zeile im Sinogramm), mit dem <b>Rampenfilter</b> gefaltet und über das Bild zurückprojiziert. Genau so – nur in 3D mit tausenden Projektionen – arbeitet die Rekonstruktion deiner Anlage.</p></div></div></div>`;
  const N=128;const img=new Float32Array(N*N);
  const circ=(x,y,a,b,r)=>(x-a)**2+(y-b)**2<r*r;
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){const x=(i+.5)/N*2-1,y=(j+.5)/N*2-1;let v=0;
    if(Math.abs(x)<0.8&&Math.abs(y)<0.62&&!(Math.abs(x)>0.5&&Math.abs(y)>0.35&&(Math.abs(x)-0.5)**2+(Math.abs(y)-0.35)**2>0.3**2))v=1;
    if(circ(x,y,-0.38,0.05,0.2)||circ(x,y,0.35,-0.15,0.14))v=0;
    if(circ(x,y,0.1,0.38,0.045)||circ(x,y,0.5,0.3,0.03)||circ(x,y,-0.15,-0.4,0.055)||circ(x,y,0.05,-0.05,0.025))v=0;
    if(circ(x,y,-0.05,-0.25,0.04))v=2.6;
    img[j*N+i]=v;}
  const c0=document.getElementById('c0'),c1=document.getElementById('c1'),c2=document.getElementById('c2');
  const x0=c0.getContext('2d'),x1=c1.getContext('2d'),x2=c2.getContext('2d');
  const base=x0.createImageData(N,N);
  for(let k=0;k<N*N;k++){const v=Math.min(255,img[k]*150);base.data[k*4]=v;base.data[k*4+1]=v+4>255?255:v+4;base.data[k*4+2]=v+10>255?255:v+10;base.data[k*4+3]=255;}
  x0.putImageData(base,0,0);
  let A=180,filt=1,noise=0,running=false,step=0,proj=[],rec=new Float32Array(N*N);const my=runId;
  const tau=2/N;const hK=new Float32Array(2*N-1);for(let n=-(N-1);n<N;n++){hK[n+N-1]=n===0?1/(4*tau*tau):(n%2?-1/(n*n*Math.PI*Math.PI*tau*tau):0);}
  function project(th){const p=new Float32Array(N);const c=Math.cos(th),s=Math.sin(th);
    for(let j=0;j<N;j++){const t=(j+.5)/N*2-1;let sum=0;for(let k=0;k<N;k++){const sv=(k+.5)/N*2-1;const x=t*c-sv*s,y=t*s+sv*c;const ii=Math.floor((x+1)/2*N),jj=Math.floor((y+1)/2*N);if(ii>=0&&ii<N&&jj>=0&&jj<N)sum+=img[jj*N+ii];}p[j]=sum*tau;}
    if(noise)for(let j=0;j<N;j++)p[j]+=gauss()*0.03;return p;}
  function prep(){proj=[];for(let a=0;a<A;a++)proj.push(project(a*Math.PI/A));rec=new Float32Array(N*N);step=0;
    c1.height=A;x1.clearRect(0,0,N,A);x2.fillStyle='#070b11';x2.fillRect(0,0,N,N);x0.putImageData(base,0,0);info();}
  function filterP(p){if(!filt)return p;const q=new Float32Array(N);for(let j=0;j<N;j++){let s=0;for(let k=0;k<N;k++)s+=p[k]*hK[j-k+N-1];q[j]=s*tau;}return q;}
  function back(a){const th=a*Math.PI/A,c=Math.cos(th),s=Math.sin(th);const q=filterP(proj[a]);const sc=Math.PI/A;
    for(let j=0;j<N;j++){const y=(j+.5)/N*2-1;for(let i=0;i<N;i++){const x=(i+.5)/N*2-1;const t=x*c+y*s;const f=(t+1)/2*N-.5;const k=Math.floor(f);if(k<0||k>=N-1)continue;const wv=f-k;rec[j*N+i]+=(q[k]*(1-wv)+q[k+1]*wv)*sc;}}
    // Sinogramm-Zeile
    const row=x1.createImageData(N,1);for(let j=0;j<N;j++){const v=Math.min(255,Math.max(0,proj[a][j]/2.2*255));row.data[j*4]=v*0.75;row.data[j*4+1]=v*0.55;row.data[j*4+2]=v;row.data[j*4+3]=255;}x1.putImageData(row,0,a);}
  function show(){let mn=1e9,mx=-1e9;for(const v of rec){if(v<mn)mn=v;if(v>mx)mx=v;}if(filt){mn=0;mx=Math.max(mx*0.45,1e-6);}
    const im=x2.createImageData(N,N);for(let k=0;k<N*N;k++){let v=(rec[k]-mn)/(mx-mn);v=Math.max(0,Math.min(1,v))*255;im.data[k*4]=v;im.data[k*4+1]=Math.min(255,v+4);im.data[k*4+2]=Math.min(255,v+10);im.data[k*4+3]=255;}x2.putImageData(im,0,0);
    // Linie im Original
    x0.putImageData(base,0,0);if(step<A&&step>0){const th=step*Math.PI/A;x0.strokeStyle=C.gd;x0.lineWidth=1.2;x0.shadowColor=C.gd;x0.shadowBlur=4;x0.beginPath();const c=Math.cos(th+Math.PI/2),s=Math.sin(th+Math.PI/2);x0.moveTo(64-c*90,64-s*90);x0.lineTo(64+c*90,64+s*90);x0.stroke();x0.shadowBlur=0;}}
  function info(){document.getElementById('lp').innerHTML=`<span class="pill" style="--ac:${V.li}">WINKEL ${step}/${A}</span><span class="pill" style="--ac:${V.gr}">${filt?'FBP':'OHNE FILTER'}</span><span class="pill" style="--ac:${noise?V.rd:'var(--mut)'}">${noise?'RAUSCHEN AN':'OHNE RAUSCHEN'}</span>`;}
  function loop(){if(my!==runId||!document.getElementById('c2'))return;if(running){const per=Math.max(1,Math.round(A/90));for(let k=0;k<per&&step<A;k++){back(step);step++;}show();info();if(step>=A){running=false;document.getElementById('go').textContent='▶ NOCHMAL';}}requestAnimationFrame(loop);}
  const goB=document.getElementById('go');
  goB.onclick=()=>{if(step>=A)prep();running=!running;goB.textContent=running?'❚❚ PAUSE':'▶ WEITER';};
  document.getElementById('rs').onclick=()=>{running=false;goB.textContent='▶ START';prep();};
  const seg=(id,fn)=>document.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#'+id+' button').forEach(q=>q.classList.remove('on'));b.classList.add('on');fn(+b.dataset.v);running=false;goB.textContent='▶ START';prep();});
  seg('na',v=>A=v);seg('fi',v=>filt=v);seg('no',v=>noise=v);
  prep();loop();
};

/* ---- Fehler-Detektiv: Spiel ---- */
EXTRA.detektiv=(ex)=>{
  const K=[['GAS','Gaspore',V.bl],['LUNKER','Schwindungslunker',V.or],['EINSCHLUSS','Dichter Einschluss',V.gd],['KERN','Kernbruch',V.li]];
  const EXPL={GAS:'Rund, glatte Wände, scharf begrenzt – typisch für eingeschlossenes Gas.',LUNKER:'Zerklüftet und schwammartig – entsteht bei der Erstarrung an Materialanhäufungen.',EINSCHLUSS:'Heller als Aluminium = höhere Dichte, z. B. ein Eisenpartikel.',KERN:'Im Kanal liegt Material – der Sandkern ist gebrochen und Metall ist hineingeflossen.'};
  let score=0,total=0,streak=0,cur=null;
  ex.innerHTML=`<div class="sec fx" style="--i:2">Spiel · Erkenne den Fehler</div>
  <div class="panel fx" style="--i:2"><div class="pills" id="sc"></div>
  <div class="cv" style="max-width:420px;margin:0 auto"><span class="lbl pill" style="--ac:${V.rd}">CT-SCHNITT · ALSI-GUSS</span><canvas id="dg" width="220" height="220" style="image-rendering:auto"></canvas></div>
  <div class="hint" style="text-align:center;margin:10px 0">Welcher Fehler ist in diesem Schnitt versteckt?<br><span style="font-size:12.5px">Hinweis: Die zwei großen Öffnungen sind gewollte Kanäle (Sandkerne, z. B. Wassermantel).</span></div>
  <div class="row2" id="ans" style="grid-template-columns:1fr 1fr">${K.map(k=>`<button class="qopt" data-k="${k[0]}" style="text-align:center;font-family:'JetBrains Mono',monospace;font-weight:700;color:${k[2]}">${k[1].toUpperCase()}</button>`).join('')}</div>
  <div id="dfb"></div></div>`;
  const cv=document.getElementById('dg'),x=cv.getContext('2d');const N=220;
  function gen(){
    cur=K[Math.floor(Math.random()*4)][0];
    const f=new Float32Array(N*N);
    const holes=[[70,120,22],[150,90,18]];
    const inPart=(i,j)=>{const u=(i-110)/88,v=(j-110)/68;if(Math.abs(u)>1||Math.abs(v)>1)return false;if(Math.abs(u)>0.75&&Math.abs(v)>0.7&&((Math.abs(u)-0.75)/0.25)**2+((Math.abs(v)-0.7)/0.3)**2>1)return false;return true;};
    for(let j=0;j<N;j++)for(let i=0;i<N;i++){let v=0.07;if(inPart(i,j))v=0.62;for(const h of holes)if((i-h[0])**2+(j-h[1])**2<h[2]**2)v=0.07;f[j*N+i]=v;}
    const free=()=>{for(let t=0;t<500;t++){const i=40+Math.random()*140,j=60+Math.random()*100;let ok=inPart(i,j);for(const h of holes)if(Math.hypot(i-h[0],j-h[1])<h[2]+16)ok=false;if(ok&&inPart(i+12,j)&&inPart(i-12,j)&&inPart(i,j+12)&&inPart(i,j-12))return [i,j];}return [110,140];};
    const disk=(a,b,r,val)=>{for(let j=Math.floor(b-r-1);j<=b+r+1;j++)for(let i=Math.floor(a-r-1);i<=a+r+1;i++){if(i<0||j<0||i>=N||j>=N)continue;if((i-a)**2+(j-b)**2<r*r)f[j*N+i]=val;}};
    if(cur==='GAS'){const [a,b]=free();disk(a,b,5+Math.random()*4,0.07);if(Math.random()<.5){const [c,d]=free();disk(c,d,2.5,0.07);}}
    if(cur==='LUNKER'){let [a,b]=free();for(let k=0;k<45;k++){disk(a,b,1+Math.random()*2.2,0.07+Math.random()*0.25);a+=(Math.random()-.5)*5;b+=(Math.random()-.5)*5;}}
    if(cur==='EINSCHLUSS'){const [a,b]=free();for(let k=0;k<5;k++)disk(a+(Math.random()-.5)*4,b+(Math.random()-.5)*4,1.8+Math.random()*1.5,1.0);}
    if(cur==='KERN'){const h=holes[Math.floor(Math.random()*2)];const ang=Math.random()*Math.PI;const w=4+Math.random()*3;
      for(let j=0;j<N;j++)for(let i=0;i<N;i++){const dx=i-h[0],dy=j-h[1];if(dx*dx+dy*dy<h[2]*h[2]){const d=Math.abs(-dx*Math.sin(ang)+dy*Math.cos(ang));if(d<w)f[j*N+i]=0.62;}}}
    // Glätten
    const g=new Float32Array(N*N);for(let j=1;j<N-1;j++)for(let i=1;i<N-1;i++){let s=0;for(let b=-1;b<=1;b++)for(let a=-1;a<=1;a++)s+=f[(j+b)*N+i+a];g[j*N+i]=s/9;}
    const im=x.createImageData(N,N);
    for(let k=0;k<N*N;k++){let v=g[k]+gauss()*0.035;v=Math.max(0,Math.min(1,v))*255;im.data[k*4]=v;im.data[k*4+1]=Math.min(255,v+3);im.data[k*4+2]=Math.min(255,v+8);im.data[k*4+3]=255;}
    x.putImageData(im,0,0);
    document.getElementById('dfb').innerHTML='';
    document.querySelectorAll('#ans .qopt').forEach(b=>{b.classList.remove('ok','no');b.disabled=false;});
    sc();
  }
  function sc(){document.getElementById('sc').innerHTML=`<span class="pill" style="--ac:${V.gr}">RICHTIG ${score}/${total}</span><span class="pill" style="--ac:${V.gd}">SERIE ${streak}</span>`;}
  document.querySelectorAll('#ans .qopt').forEach(b=>b.onclick=()=>{
    if(b.disabled)return;const ok=b.dataset.k===cur;total++;if(ok){score++;streak++;}else streak=0;
    document.querySelectorAll('#ans .qopt').forEach(q=>{q.disabled=true;if(q.dataset.k===cur)q.classList.add('ok');});
    if(!ok)b.classList.add('no');
    const name=K.find(k=>k[0]===cur)[1];
    document.getElementById('dfb').innerHTML=`<div class="fb" style="border-color:${ok?V.gr:V.rd}"><b style="color:${ok?V.gr:V.rd}">${ok?'✓ RICHTIG!':'✗ LEIDER FALSCH'}</b> – Es war: <b>${name}</b>. ${EXPL[cur]}</div><button class="btn" style="margin-top:10px;width:100%" id="nx">NÄCHSTES BILD ›</button>`;
    document.getElementById('nx').onclick=gen;sc();
  });
  gen();
};

    ex.innerHTML=`<div class="panel fx"><div class="row" style="display:flex;justify-content:space-between" class="sub"><span class="sub">FRAGE ${i+1} / 10</span><span class="sub" style="color:${V.gr}">${pts} PUNKTE</span></div><div class="bar" style="margin:8px 0 16px"><i style="width:${i*10}%"></i></div>
    <h3 style="font-family:Inter;text-transform:none;letter-spacing:0;font-size:18px;color:var(--tx);margin-bottom:14px;font-weight:700">${q[0]}</h3>
    ${q[1].map((o,k)=>`<button class="qopt" data-k="${k}"><span class="mono" style="color:var(--ac);font-weight:800;margin-right:8px">${'ABCD'[k]}</span>${o}</button>`).join('')}<div id="qf"></div></div>`;
    ex.querySelectorAll('.qopt').forEach(b=>b.onclick=()=>{
      if(ex.querySelector('.qopt.ok'))return;const k=+b.dataset.k;const ok=k===q[2];if(ok)pts++;
      ex.querySelectorAll('.qopt')[q[2]].classList.add('ok');if(!ok)b.classList.add('no');
      document.getElementById('qf').innerHTML=`<div class="fb" style="border-color:${ok?V.gr:V.rd}"><b style="color:${ok?V.gr:V.rd}">${ok?'✓ RICHTIG':'✗ FALSCH'}</b> – ${q[3]}</div><button class="btn" style="margin-top:10px;width:100%" id="qn">${i<9?'NÄCHSTE FRAGE ›':'ERGEBNIS ANZEIGEN ›'}</button>`;
      document.getElementById('qn').onclick=()=>{i++;show();};
    });
  }
  start();
};

/* ---- Detektor: Bildqualität ---- */
EXTRA.detektor=(ex)=>{
  ex.innerHTML=`<div class="sec fx" style="--i:2">Live · Bildqualität</div>
  <div class="panel fx" style="--i:2"><h3>Rauschen, Belichtung und Scanzeit</h3><div class="hint">Ein CT-Schnitt mit Poren von 0,3 bis 1,5 mm. Ändere die Einstellungen und vergleiche, wie gut die kleinen Poren sichtbar sind.</div>
  <div class="cv" style="max-width:360px;margin:0 auto"><canvas id="dq" width="160" height="160" style="aspect-ratio:1/1;height:auto"></canvas></div>
  <div class="kv"><div><span>SNR relativ</span><b id="q1"></b></div><div><span>Zeit je Projektion</span><b id="q2"></b></div><div><span>Scanzeit</span><b id="q3"></b></div><div><span>Kleinste sichtbare Pore</span><b id="q4"></b></div></div>
  <div class="ctl"><div><label>Belichtungszeit <b id="tv"></b></label><input type="range" id="tt" min="100" max="2000" step="50" value="500"></div>
  <div><label>Mittelung (Bilder je Projektion)</label><div class="seg" id="av"><button data-v="1" class="on">1×</button><button data-v="2">2×</button><button data-v="4">4×</button><button data-v="8">8×</button><button data-v="16">16×</button></div></div>
  <div><label>Binning</label><div class="seg" id="bn"><button data-v="1" class="on">1×1</button><button data-v="2">2×2</button></div></div>
  <div><label>Projektionen <b id="pv"></b></label><input type="range" id="pp" min="400" max="3000" step="100" value="1500"></div></div></div>`;
  let avg=1,bin=1;const cv=document.getElementById('dq'),x=cv.getContext('2d');const N=160;
  const pores=[[40,45,1.5],[100,40,1.0],[130,90,0.7],[60,110,0.5],[110,125,0.4],[30,140,0.3],[85,80,0.8]];
  const base=new Float32Array(N*N);
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){let v=0.62;for(const p of pores){const r=p[2]*5;const d=Math.hypot(i-p[0],j-p[1]);if(d<r+1){const w=Math.max(0,Math.min(1,r+0.5-d));v=v*(1-w)+0.08*w;}}base[j*N+i]=v;}
  function draw(){
    const t=+document.getElementById('tt').value,np=+document.getElementById('pp').value;
    document.getElementById('tv').textContent=t+' ms';document.getElementById('pv').textContent=np;
    const rel=(t/500)*avg*bin*bin;const snr=Math.sqrt(rel);const sigma=0.16/snr;
    const im=x.createImageData(N,N);
    const val=(i,j)=>{if(bin===1)return base[j*N+i];const a=i-(i%2),b=j-(j%2);return (base[b*N+a]+base[b*N+a+1]+base[(b+1)*N+a]+base[(b+1)*N+a+1])/4;};
    const nz=new Float32Array(N*N);for(let j=0;j<N;j+=bin)for(let i=0;i<N;i+=bin){const g=gauss()*sigma;for(let b=0;b<bin;b++)for(let a=0;a<bin;a++)nz[(j+b)*N+i+a]=g;}
    for(let k=0;k<N*N;k++){const i=k%N,j=(k/N)|0;let v=val(i,j)+nz[k];v=Math.max(0,Math.min(1,v))*255;im.data[k*4]=v;im.data[k*4+1]=Math.min(255,v+3);im.data[k*4+2]=Math.min(255,v+8);im.data[k*4+3]=255;}
    x.putImageData(im,0,0);
    // kleinste sichtbare Pore grob: CNR*Flächenfaktor >= 5
    let vis='> 1,5 mm';for(const d of [0.3,0.4,0.5,0.7,0.8,1.0,1.5]){const px=d*5/bin;const cnr=(0.54/sigma)*Math.min(1,px/2)*Math.sqrt(Math.max(1,px));if(cnr>=4){vis=fmt(d,1)+' mm';break;}}
    const tp=t*avg/1000;const total=np*tp;
    document.getElementById('q1').textContent='× '+fmt(snr,2);
    document.getElementById('q2').textContent=fmt(tp,2)+' s';
    document.getElementById('q3').textContent=total<3600?fmt(total/60,0)+' min':fmt(total/3600,1)+' h';
    document.getElementById('q4').textContent=vis;
  }
  document.getElementById('tt').oninput=draw;document.getElementById('pp').oninput=draw;
  segBind('av',v=>{avg=+v;draw();});segBind('bn',v=>{bin=+v;draw();});draw();
};

/* ---- Parameter-Assistent ---- */
EXTRA.assistent=(ex)=>{
  const P={zk:['ZYLINDERKOPF',450,70],kg:['KURBELGEHÄUSE',500,90],st:['STRUKTURTEIL',350,25],eg:['E-GEHÄUSE',300,15]};
  ex.innerHTML=`<div class="sec fx" style="--i:2">Assistent · Eure 450-kV-Anlage</div>
  <div class="panel fx" style="--i:2"><h3>Bauteil &amp; Ziel</h3><div class="hint">Wähle ein Bauteil und passe die Maße an. Der Assistent schlägt Richtwerte vor.</div>
  <div class="ctl"><div><label>Bauteil</label><div class="seg" id="bt">${Object.entries(P).map(([k,v],i)=>`<button data-v="${k}" class="${i?'':'on'}">${v[0]}</button>`).join('')}</div></div>
  <div><label>Ziel</label><div class="seg" id="zl"><button data-v="p" class="on">PORENPRÜFUNG</button><button data-v="m">MESSUNG</button></div></div>
  <div><label>Größte Abmessung (Drehdurchmesser) <b id="sv"></b></label><input type="range" id="sz" min="50" max="700" step="10"></div>
  <div><label>Dickste Aluminium-Strecke im Strahl <b id="dv"></b></label><input type="range" id="dk" min="5" max="150" step="5"></div>
  <div class="row2" style="grid-template-columns:1fr 1fr"><div><label class="sub">Detektor Pixel</label><input class="num-in" id="dp" type="number" value="2048"></div><div><label class="sub">Pixelgröße <span style="text-transform:none">(µm)</span></label><input class="num-in" id="dz" type="number" value="200"></div></div></div></div>
  <div class="panel fx" style="--i:3"><h3>Empfehlung</h3><div class="kv" id="rk"></div><div id="rw"></div>
  <div class="box g" style="margin-top:12px"><div class="lbl">Wichtig</div>Das sind vereinfachte Richtwerte zum Lernen. Verbindlich sind eure Prüfanweisung und die Erfahrung an der Anlage.</div></div>`;
  let part='zk',goal='p';
  const MU=[[60,0.75],[80,0.55],[100,0.46],[150,0.37],[200,0.33],[250,0.30],[300,0.28],[400,0.25],[500,0.23]];
  function eFor(mu){if(mu>=MU[0][1])return MU[0][0];for(let k=1;k<MU.length;k++){if(mu>=MU[k][1]){const [e0,m0]=MU[k-1],[e1,m1]=MU[k];return e0+(e1-e0)*(m0-mu)/(m0-m1);}}return 600;}
  function setPart(){const p=P[part];document.getElementById('sz').value=p[1];document.getElementById('dk').value=p[2];}
  function calc(){
    const D=+document.getElementById('sz').value,d=+document.getElementById('dk').value,npx=+document.getElementById('dp').value||2048,pit=+document.getElementById('dz').value||200;
    document.getElementById('sv').textContent=D+' mm';document.getElementById('dv').textContent=d+' mm';
    const notes=[];
    const mu=Math.log(1/0.03)/(d/10);const E=eFor(mu);let kv=Math.ceil(E/0.42/10)*10;
    if(kv>450){notes.push(['rd','Durchstrahlung grenzwertig: Selbst 450 kV reichen rechnerisch kaum. Bauteil schräg stellen, Teilbereiche scannen oder länger belichten.']);kv=450;}
    kv=Math.max(100,kv);
    let vox=D*1000/(npx*0.9);let M=pit/vox;
    if(M<1.05){M=1.05;vox=pit/M;notes.push(['rd',`Das Bauteil (${D} mm) passt nicht komplett ins Messfeld (ca. ${fmt(npx*pit/1000/1.05,0)} mm). Lösung: Messfeld-Erweiterung (z. B. Detektorversatz) oder mehrere Scans.`]);}
    const ug=f=>f*1000*(M-1)/M;
    let foc=0.4;if(kv>=300&&ug(1.0)<=1.5*vox)foc=1.0;
    if(kv>=300&&foc===0.4)notes.push(['gd','Hohe Spannung, aber der 1,0-mm-Fokus wäre zu unscharf für diese Voxelgröße – daher 0,4 mm mit begrenzter Leistung (längere Belichtung einplanen).']);
    const Pmax=foc<0.5?700:1500;const ma=Math.min(4,Pmax*0.85/kv);
    const filt=kv<150?'0,5 mm Cu':kv<250?'1 mm Cu':kv<350?'2 mm Cu':'3–4 mm Cu';
    let proj=Math.round(npx*(goal==='p'?0.75:1.25)/100)*100;
    const minPore=vox*3/1000;
    document.getElementById('rk').innerHTML=[['Spannung',kv+' kV'],['Fokus',fmt(foc,1)+' mm'],['Strom',fmt(ma,2)+' mA'],['Leistung',fmt(kv*ma,0)+' W'],['Vorfilter',filt],['Voxelgröße',fmt(vox,0)+' µm'],['Vergrößerung',fmt(M,2)+' ×'],['Projektionen',proj],['Poren sicher ab',fmt(minPore,2)+' mm'],['Unschärfe',fmt(ug(foc),0)+' µm']].map(r=>`<div><span>${r[0]}</span><b>${r[1]}</b></div>`).join('');
    const why=[['gr',`<b>${kv} kV</b>: Bei ${d} mm Aluminium kommen damit an der dicksten Stelle noch ca. 3 % durch.`],['gr',`<b>Fokus ${fmt(foc,1)} mm</b>: Unschärfe im Bauteil ≈ ${fmt(ug(foc),0)} µm bei ${fmt(vox,0)} µm Voxelgröße.`],['gr',`<b>${proj} Projektionen</b>: ${goal==='p'?'für Porenprüfung ausreichend, Scan bleibt kurz':'für Messungen mehr Projektionen = genauere Kanten'}.`]];
    document.getElementById('rw').innerHTML=why.concat(notes).map(n=>`<div class="fb" style="border-color:var(--${n[0]})">${n[1]}</div>`).join('');
  }
  segBind('bt',v=>{part=v;setPart();calc();});segBind('zl',v=>{goal=v;calc();});
  ['sz','dk','dp','dz'].forEach(i=>document.getElementById(i).oninput=calc);setPart();calc();
};

EXTRA.pruefplanung=(ex)=>{
  const Z={A:['ZONE A · DICHTFLÄCHE',0.5,1.0],B:['ZONE B · FUNKTION',1.5,0.5],C:['ZONE C · UNKRITISCH',3.0,0]};
  ex.innerHTML=`<div class="sec fx" style="--i:2">Simulator · i.O. oder n.i.O.?</div>
  <div class="panel fx" style="--i:2"><h3>Pore bewerten</h3><div class="hint">Beispielwerte zum Üben – eure echten Grenzwerte stehen in Zeichnung und Prüfanweisung.</div>
  <div class="ctl"><div><label>Prüfzone</label><div class="seg" id="zn">${Object.entries(Z).map(([k,v],i)=>`<button data-v="${k}" class="${i?'':'on'}">${v[0]}</button>`).join('')}</div></div>
  <div><label>Porendurchmesser <b id="pdv"></b></label><input type="range" id="pd" min="0.1" max="4" step="0.1" value="0.8"></div>
  <div><label>Abstand zur bearbeiteten Oberfläche <b id="pav"></b></label><input type="range" id="pa" min="0" max="5" step="0.1" value="2"></div></div>
  <div id="vd" style="margin-top:14px"></div></div>
  <div class="sec fx" style="--i:3">Rechner · Prüferübereinstimmung (Kappa)</div>
  <div class="panel fx" style="--i:3"><h3>Zwei Prüfer, gleiche Teile</h3><div class="hint">Trage ein, wie oft die beiden Prüfer gleich oder unterschiedlich entschieden haben.</div>
  <div class="row2" style="grid-template-columns:1fr 1fr"><div><label class="sub">Beide i.O.</label><input class="num-in kp" id="ka" type="number" value="40"></div><div><label class="sub">A i.O. · B n.i.O.</label><input class="num-in kp" id="kb" type="number" value="3"></div><div><label class="sub">A n.i.O. · B i.O.</label><input class="num-in kp" id="kc" type="number" value="2"></div><div><label class="sub">Beide n.i.O.</label><input class="num-in kp" id="kd" type="number" value="15"></div></div>
  <div class="kv"><div><span>Übereinstimmung</span><b id="k1"></b></div><div><span>Kappa κ</span><b id="k2"></b></div></div><div id="k3"></div></div>`;
  let zone='A';
  function bew(){const d=+document.getElementById('pd').value,a=+document.getElementById('pa').value;const z=Z[zone];
    document.getElementById('pdv').textContent=fmt(d,1)+' mm';document.getElementById('pav').textContent=fmt(a,1)+' mm';
    const r=[];if(d>z[1])r.push(`Durchmesser ${fmt(d,1)} mm > max. ${fmt(z[1],1)} mm`);if(z[2]&&a<z[2])r.push(`Abstand ${fmt(a,1)} mm < min. ${fmt(z[2],1)} mm zur Oberfläche`);
    const ok=!r.length;
    document.getElementById('vd').innerHTML=`<div style="text-align:center;padding:14px;border-radius:14px;border:1px solid var(--${ok?'gr':'rd'});background:color-mix(in srgb,var(--${ok?'gr':'rd'}) 10%,transparent)"><div class="mono" style="font-size:30px;font-weight:800;color:var(--${ok?'gr':'rd'})">${ok?'✓ i.O.':'✗ n.i.O.'}</div><div style="color:var(--mut);font-size:14px">${ok?`Grenzwerte ${z[0].split('· ')[1]}: max. Ø ${fmt(z[1],1)} mm${z[2]?`, min. ${fmt(z[2],1)} mm Abstand`:''}`:r.join(' · ')}</div></div>`;}
  function kap(){const a=+document.getElementById('ka').value||0,b=+document.getElementById('kb').value||0,c=+document.getElementById('kc').value||0,d=+document.getElementById('kd').value||0;const n=a+b+c+d;
    if(!n){document.getElementById('k1').textContent='–';document.getElementById('k2').textContent='–';return;}
    const p0=(a+d)/n,pe=((a+b)*(a+c)+(c+d)*(b+d))/(n*n);const k=pe<1?(p0-pe)/(1-pe):1;
    document.getElementById('k1').textContent=fmt(p0*100,1)+' %';document.getElementById('k2').textContent=fmt(k,2);
    const col=k>=0.75?'gr':k>=0.4?'gd':'rd';
    document.getElementById('k3').innerHTML=`<div class="fb" style="border-color:var(--${col})"><b style="color:var(--${col})">${k>=0.75?'Gute Übereinstimmung':k>=0.4?'Mäßige Übereinstimmung':'Schlechte Übereinstimmung'}</b> – ${k>=0.75?'die Prüfer entscheiden weitgehend gleich.':'Grenzmuster und Schulung können helfen, einheitlicher zu entscheiden.'} Kappa berücksichtigt, dass ein Teil der Übereinstimmung auch zufällig wäre.</div>`;}
  segBind('zn',v=>{zone=v;bew();});['pd','pa'].forEach(i=>document.getElementById(i).oninput=bew);
  ex.querySelectorAll('.kp').forEach(i=>i.oninput=kap);bew();kap();
};

/* ---- 3D-Bauteil ---- */
function loadThree(cb,err){if(window.THREE)return cb();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';s.onload=cb;s.onerror=err;document.head.appendChild(s);}
EXTRA.bauteil3d=(ex)=>{
  ex.innerHTML=`<div class="panel fx" style="--i:2;padding:10px"><div id="t3wrap" style="position:relative;border-radius:12px;overflow:hidden;background:#070b11;touch-action:none"><canvas id="t3" style="height:340px"></canvas>
  <div style="position:absolute;left:10px;top:10px" class="pills"><span class="pill" style="--ac:${V.li}" id="t3info">LADE 3D …</span></div>
  <div style="position:absolute;right:10px;bottom:10px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#7f8b9c">ZIEHEN = DREHEN</div></div>
  <div class="ctl"><div><label>Schnittebene <b id="cpv"></b></label><input type="range" id="cp" min="-15" max="15" step="0.1" value="15"></div>
  <div class="seg" id="t3o"><button data-v="h" class="on">GEHÄUSE AN</button><button data-v="c">NUR POREN</button><button data-v="r">↺ NEUE POREN</button></div></div></div>
  <div class="row2"><div class="panel fx" style="--i:3"><h3>CT-Schnitt an der Ebene</h3><div class="hint">So sähe der Schnitt in VGStudio aus.</div><div class="cv" style="max-width:420px;margin:0 auto"><canvas id="t3s" width="240" height="160" style="aspect-ratio:3/2;height:auto"></canvas></div></div>
  <div class="panel fx" style="--i:4"><h3>Defekttabelle</h3><div class="hint">Die 6 größten Poren – farbig wie in der Defektanalyse.</div><div id="t3t"></div>
  <div class="pills"><span class="pill" style="--ac:#4c9aff">&lt; 0,8 MM</span><span class="pill" style="--ac:#1fcf8f">0,8–1,4</span><span class="pill" style="--ac:#f5c542">1,4–2,0</span><span class="pill" style="--ac:#f0605d">&gt; 2,0 MM</span></div></div></div>
  <div class="panel fx" style="--i:5"><h3>Das Bauteil</h3><div class="in"><p>Ausschnitt eines Aluminium-Gussteils, <b>30 × 16 × 20 mm</b>, mit zwei Kanälen (z. B. Öl- oder Wasserkanal), verteilten Gasporen und einem kleinen Lunker-Nest. Ziehe die Schnittebene durch das Teil – genau so suchst du in der CT Schicht für Schicht nach Defekten.</p></div></div>`;
  const my=runId;
  const colOf=d=>d<0.8?0x4c9aff:d<1.4?0x1fcf8f:d<2.0?0xf5c542:0xf0605d;
  const colS=d=>d<0.8?'#4c9aff':d<1.4?'#1fcf8f':d<2.0?'#f5c542':'#f0605d';
  const CH=[[-3,-2,2.6],[4,3,2.0]]; // Kanäle entlang x: (y,z,r) in mm
  const HX=15,HY=8,HZ=10;
  let pores=[];
  function genPores(){pores=[];let tries=0;
    while(pores.length<34&&tries<3000){tries++;const d=Math.random()<0.75?0.4+Math.random()*1.0:1.2+Math.random()*1.4;const r=d/2;
      const p=[(Math.random()*2-1)*(HX-1.5),(Math.random()*2-1)*(HY-1.2),(Math.random()*2-1)*(HZ-1.2),d,'gas'];
      if(CH.some(c=>Math.hypot(p[1]-c[0],p[2]-c[1])<c[2]+r+0.6))continue;if(pores.some(q=>Math.hypot(p[0]-q[0],p[1]-q[1],p[2]-q[2])<r+q[3]/2+0.3))continue;pores.push(p);}
    // Lunker-Nest
    let c=[6+Math.random()*4,-3,-5];for(let k=0;k<14;k++){pores.push([c[0],c[1],c[2],0.3+Math.random()*0.5,'lunker']);c=[c[0]+(Math.random()-.5)*1.2,c[1]+(Math.random()-.5)*1.2,c[2]+(Math.random()-.5)*1.2];}
    pores.forEach(p=>{p[5]=Math.min(HX-Math.abs(p[0]),HY-Math.abs(p[1]),HZ-Math.abs(p[2]),...CH.map(c=>Math.hypot(p[1]-c[0],p[2]-c[1])-c[2]))-p[3]/2;});
  }
  genPores();
  function table(){const big=pores.filter(p=>p[4]==='gas').sort((a,b)=>b[3]-a[3]).slice(0,6);
    document.getElementById('t3t').innerHTML=`<table class="t"><tr><th>#</th><th>Ø mm</th><th>Vol. mm³</th><th>Abst. mm</th></tr>${big.map((p,i)=>`<tr><td><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${colS(p[3])};margin-right:6px"></span>${i+1}</td><td class="mono">${fmt(p[3],2)}</td><td class="mono">${fmt(Math.PI/6*p[3]**3,3)}</td><td class="mono">${fmt(Math.max(0,p[5]),1)}</td></tr>`).join('')}</table>`;}
  table();
  const sc=document.getElementById('t3s'),sx=sc.getContext('2d');
  function slice(xp){const W=240,H=160;const im=sx.createImageData(W,H);
    for(let j=0;j<H;j++)for(let i=0;i<W;i++){const z=(i/W*2-1)*12.5,y=(1-j/H*2)*8.3;let v=0.07;
      if(Math.abs(z)<HZ&&Math.abs(y)<HY)v=0.62;
      for(const c of CH)if(Math.hypot(y-c[0],z-c[1])<c[2])v=0.07;
      if(v>0.5)for(const p of pores){const rr=(p[3]/2)**2-(xp-p[0])**2;if(rr>0&&(y-p[1])**2+(z-p[2])**2<rr){v=0.09;break;}}
      v=Math.max(0,Math.min(1,v+gauss()*0.03))*255;const k=(j*W+i)*4;im.data[k]=v;im.data[k+1]=Math.min(255,v+3);im.data[k+2]=Math.min(255,v+8);im.data[k+3]=255;}
    sx.putImageData(im,0,0);
    if(Math.abs(xp)>HX){sx.fillStyle='#7f8b9c';sx.font='700 11px "JetBrains Mono",monospace';sx.fillText('EBENE AUSSERHALB DES BAUTEILS',30,85);}
    // Poren im Schnitt markieren
    for(const p of pores){const rr=(p[3]/2)**2-(xp-p[0])**2;if(rr>0){const cx=(p[2]/12.5+1)/2*W,cy=(1-p[1]/8.3)/2*H;sx.strokeStyle=colS(p[3]);sx.lineWidth=1;sx.beginPath();sx.arc(cx,cy,Math.sqrt(rr)/12.5*W/2+3,0,7);sx.stroke();}}
  }
  loadThree(()=>{
    if(my!==runId||!document.getElementById('t3'))return;
    const T=window.THREE;const cv=document.getElementById('t3');const wrap=document.getElementById('t3wrap');
    const renderer=new T.WebGLRenderer({canvas:cv,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.localClippingEnabled=true;
    const scene=new T.Scene();const cam=new T.PerspectiveCamera(40,1,0.1,500);cam.position.set(0,18,58);cam.lookAt(0,0,0);
    scene.add(new T.AmbientLight(0xffffff,0.55));const dl=new T.DirectionalLight(0xffffff,0.9);dl.position.set(20,30,25);scene.add(dl);
    const g=new T.Group();scene.add(g);g.rotation.set(0.45,-0.6,0);
    const plane=new T.Plane(new T.Vector3(-1,0,0),15);
    const hullM=new T.MeshStandardMaterial({color:0x9aa4b1,transparent:true,opacity:0.22,depthWrite:false,roughness:0.6,metalness:0.3,clippingPlanes:[plane],side:T.DoubleSide});
    const hull=new T.Mesh(new T.BoxGeometry(HX*2,HY*2,HZ*2),hullM);g.add(hull);
    const edges=new T.LineSegments(new T.EdgesGeometry(new T.BoxGeometry(HX*2,HY*2,HZ*2)),new T.LineBasicMaterial({color:0x7f8b9c,transparent:true,opacity:0.6}));g.add(edges);
    const chM=new T.MeshStandardMaterial({color:0x3a4554,transparent:true,opacity:0.55,clippingPlanes:[plane],side:T.DoubleSide});
    CH.forEach(c=>{const m=new T.Mesh(new T.CylinderGeometry(c[2],c[2],HX*2,32,1,true),chM);m.rotation.z=Math.PI/2;m.position.set(0,c[0],c[1]);g.add(m);});
    const poreG=new T.Group();g.add(poreG);
    function buildPores(){while(poreG.children.length)poreG.remove(poreG.children[0]);pores.forEach(p=>{const m=new T.Mesh(new T.SphereGeometry(p[3]/2,16,12),new T.MeshBasicMaterial({color:colOf(p[3]),clippingPlanes:[plane]}));m.position.set(p[0],p[1],p[2]);poreG.add(m);});}
    buildPores();
    const cutM=new T.MeshBasicMaterial({color:0x1fcf8f,transparent:true,opacity:0.12,side:T.DoubleSide,depthWrite:false});
    const cut=new T.Mesh(new T.PlaneGeometry(HZ*2+2,HY*2+2),cutM);cut.rotation.y=Math.PI/2;g.add(cut);
    const cutE=new T.LineSegments(new T.EdgesGeometry(new T.PlaneGeometry(HZ*2+2,HY*2+2)),new T.LineBasicMaterial({color:0x1fcf8f}));cutE.rotation.y=Math.PI/2;g.add(cutE);
    let xp=15;
    function setCut(){xp=+document.getElementById('cp').value;document.getElementById('cpv').textContent=(xp>=HX?'AUS':fmt(xp+HX,1)+' mm');cut.position.x=xp;cutE.position.x=xp;cut.visible=cutE.visible=xp<HX;slice(xp<HX?xp:99);}
    document.getElementById('cp').oninput=setCut;setCut();
    segBind('t3o',v=>{if(v==='h'){hull.visible=true;g.children.forEach(o=>{if(o.geometry&&o.geometry.type==='CylinderGeometry')o.visible=true;});}else if(v==='c'){hull.visible=false;g.children.forEach(o=>{if(o.geometry&&o.geometry.type==='CylinderGeometry')o.visible=false;});}else{genPores();buildPores();table();setCut();document.querySelector('#t3o button[data-v=h]').click();}});
    let drag=null,idle=0;
    cv.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId);});
    cv.addEventListener('pointermove',e=>{if(!drag)return;g.rotation.y+=(e.clientX-drag[0])*0.01;g.rotation.x=Math.max(-1.4,Math.min(1.4,g.rotation.x+(e.clientY-drag[1])*0.01));drag=[e.clientX,e.clientY];idle=0;});
    cv.addEventListener('pointerup',()=>drag=null);cv.addEventListener('pointercancel',()=>drag=null);
    document.getElementById('t3info').textContent=pores.filter(p=>p[4]==='gas').length+' POREN + LUNKER-NEST';
    const tmp=new T.Vector3();
    function loop(){if(my!==runId||!document.getElementById('t3')){renderer.dispose();return;}
      const w=wrap.clientWidth,h=340;if(cv.width!==Math.floor(w*renderer.getPixelRatio())){renderer.setSize(w,h,false);cv.style.width='100%';cv.style.height=h+'px';cam.aspect=w/h;cam.updateProjectionMatrix();}
      if(!drag){idle++;if(idle>120)g.rotation.y+=0.003;}
      g.updateMatrixWorld();const n=new T.Vector3(-1,0,0).applyQuaternion(g.quaternion);tmp.set(xp,0,0);g.localToWorld(tmp);plane.setFromNormalAndCoplanarPoint(n,tmp);
      renderer.render(scene,cam);requestAnimationFrame(loop);}
    loop();
  },()=>{document.getElementById('t3info').textContent='3D BRAUCHT INTERNET';slice(0);document.getElementById('cp').oninput=()=>{const v=+document.getElementById('cp').value;document.getElementById('cpv').textContent=fmt(v+HX,1)+' mm';slice(v);};});
};

EXTRA.quiz=(ex)=>{
  let lvl=0,len=10,qs,i,pts;
  const LV=[['0','GEMISCHT'],['1','LEICHT'],['2','MITTEL'],['3','SCHWER']];
  function menu(){
    store.bests=store.bests||{};
    ex.innerHTML=`<div class="panel fx"><h3>Prüfungsmodus</h3><div class="hint">${QZ.length} Fragen in drei Schwierigkeitsstufen. Wähle Stufe und Länge.</div>
    <div class="ctl"><div><label>Schwierigkeit</label><div class="seg" id="ql">${LV.map(l=>`<button data-v="${l[0]}" class="${+l[0]===lvl?'on':''}">${l[1]} · ${l[0]==='0'?QZ.length:QZ.filter(q=>q[4]==+l[0]).length}</button>`).join('')}</div></div>
    <div><label>Anzahl Fragen</label><div class="seg" id="qn"><button data-v="10" class="${len===10?'on':''}">10</button><button data-v="20" class="${len===20?'on':''}">20</button></div></div></div>
    <div class="kv">${LV.map(l=>`<div><span>Bestwert ${l[1]}</span><b>${store.bests[l[0]]!=null?store.bests[l[0]]+' %':'–'}</b></div>`).join('')}</div>
    <button class="btn" id="qs" style="width:100%;margin-top:14px">▶ PRÜFUNG STARTEN</button></div>`;
    segBind('ql',v=>lvl=+v);segBind('qn',v=>len=+v);
    document.getElementById('qs').onclick=start;
  }
  function start(){const pool=QZ.filter(q=>!lvl||q[4]===lvl);qs=pool.slice().sort(()=>Math.random()-.5).slice(0,Math.min(len,pool.length));i=0;pts=0;show();}
  function show(){
    const n=qs.length;
    if(i>=n){const pct=Math.round(pts/n*100);store.bests=store.bests||{};if(store.bests[lvl]==null||pct>store.bests[lvl])store.bests[lvl]=pct;store.best=Math.max(store.best||0,Math.round(pct/10));save();
      const col=pct>=80?V.gr:pct>=50?V.gd:V.rd;
      ex.innerHTML=`<div class="panel fx" style="text-align:center;padding:28px 16px"><div class="sub">ERGEBNIS · ${LV[lvl][1]}</div><div class="mono" style="font-size:56px;font-weight:800;color:${col}">${pts}/${n}</div><div class="mono" style="color:${col};font-weight:700">${pct} %</div><p style="color:var(--mut);margin:6px 0 16px">${pct>=80?'Stark! Bestanden mit Auszeichnung.':pct>=50?'Bestanden – ein paar Lernkarten noch einmal ansehen.':'Noch nicht bestanden – die Lernkarten helfen dir weiter.'}</p><div class="pills" style="justify-content:center"><span class="pill" style="--ac:${V.gd}">BESTWERT ${store.bests[lvl]} %</span></div><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px"><button class="btn" id="again">↺ NOCHMAL</button><button class="btn ghost" id="menu">STUFE WECHSELN</button></div></div>`;
      document.getElementById('again').onclick=start;document.getElementById('menu').onclick=menu;return;}
    const q=qs[i];const ord=q[1].map((o,k)=>[o,k]).sort(()=>Math.random()-.5);
    ex.innerHTML=`<div class="panel fx"><div style="display:flex;justify-content:space-between"><span class="sub">FRAGE ${i+1} / ${n} · ${['','LEICHT','MITTEL','SCHWER'][q[4]||2]}</span><span class="sub" style="color:var(--gr)">${pts} PUNKTE</span></div><div class="bar" style="margin:8px 0 16px"><i style="width:${i/n*100}%"></i></div>
    <h3 style="font-family:Inter;text-transform:none;letter-spacing:0;font-size:18px;color:var(--tx);margin-bottom:14px;font-weight:700">${q[0]}</h3>
    ${ord.map((o,k)=>`<button class="qopt" data-k="${o[1]}"><span class="mono" style="color:var(--ac);font-weight:800;margin-right:8px">${'ABCD'[k]}</span>${o[0]}</button>`).join('')}<div id="qf"></div></div>`;
    ex.querySelectorAll('.qopt').forEach(b=>b.onclick=()=>{
      if(ex.querySelector('.qopt.ok'))return;const ok=+b.dataset.k===q[2];if(ok)pts++;
      ex.querySelectorAll('.qopt').forEach(x=>{if(+x.dataset.k===q[2])x.classList.add('ok');});if(!ok)b.classList.add('no');
      document.getElementById('qf').innerHTML=`<div class="fb" style="border-color:${ok?V.gr:V.rd}"><b style="color:${ok?V.gr:V.rd}">${ok?'✓ RICHTIG':'✗ FALSCH'}</b> – ${q[3]}</div><button class="btn" style="margin-top:10px;width:100%" id="qn2">${i<n-1?'NÄCHSTE FRAGE ›':'ERGEBNIS ANZEIGEN ›'}</button>`;
      document.getElementById('qn2').onclick=()=>{i++;show();};
    });
  }
  menu();
};

/* ============== Fehler-Detektiv mit Levels & Zeitmodus ============== */
EXTRA.detektiv=(ex)=>{
  const K0=[['GAS','Gaspore',V.bl],['LUNKER','Schwindungslunker',V.or],['EINSCHLUSS','Dichter Einschluss',V.gd],['KERN','Kernbruch',V.li]];
  const OK=['OK','Kein Fehler (i.O.)',V.gr];
  const EXPL={GAS:'Rund, glatte Wände, scharf begrenzt – typisch für eingeschlossenes Gas.',LUNKER:'Zerklüftet und schwammartig – entsteht bei der Erstarrung an Materialanhäufungen.',EINSCHLUSS:'Heller als Aluminium = höhere Dichte, z. B. ein Eisenpartikel.',KERN:'Im Kanal liegt Material – der Sandkern ist gebrochen und Metall ist hineingeflossen.',OK:'Nur Rauschen und die gewollten Kanäle – das Teil ist in Ordnung.'};
  let level=1,timed=false,score=0,total=0,streak=0,cur=null,tLeft=0,timer=null;const my=runId;
  store.detBest=store.detBest||{};
  const K=()=>level===3?K0.concat([OK]):K0;
  ex.innerHTML=`<div class="sec fx" style="--i:2">Spiel · Erkenne den Fehler</div>
  <div class="panel fx" style="--i:2">
  <div class="ctl" style="margin-top:0"><div><label>Level</label><div class="seg" id="lv"><button data-v="1" class="on">1 · GROSS</button><button data-v="2">2 · KLEINER</button><button data-v="3">3 · PROFI</button></div></div>
  <div><label>Modus</label><div class="seg" id="md"><button data-v="0" class="on">ÜBEN</button><button data-v="1">⏱ 60 SEKUNDEN</button></div></div></div>
  <div class="pills" id="sc"></div>
  <div class="cv" style="max-width:420px;margin:0 auto"><span class="lbl pill" style="--ac:${V.rd}">CT-SCHNITT · ALSI-GUSS</span><canvas id="dg" width="220" height="220" style="image-rendering:auto"></canvas></div>
  <div class="hint" style="text-align:center;margin:10px 0">Welcher Fehler ist in diesem Schnitt versteckt?<br><span style="font-size:12.5px" id="lh"></span></div>
  <div class="row2" id="ans" style="grid-template-columns:1fr 1fr"></div>
  <div id="dfb"></div></div>`;
  const cv=document.getElementById('dg'),x=cv.getContext('2d');const N=220;
  function buttons(){document.getElementById('ans').innerHTML=K().map(k=>`<button class="qopt" data-k="${k[0]}" style="text-align:center;font-family:'JetBrains Mono',monospace;font-weight:700;color:${k[2]}${k[0]==='OK'?';grid-column:span 2':''}">${k[1].toUpperCase()}</button>`).join('');
    document.querySelectorAll('#ans .qopt').forEach(b=>b.onclick=()=>answer(b));
    document.getElementById('lh').textContent=level===1?'Die zwei großen Öffnungen sind gewollte Kanäle (Sandkerne).':level===2?'Kleinere Fehler, mehr Rauschen.':'Winzige Fehler, starkes Rauschen – und manchmal ist gar kein Fehler drin!';}
  function gen(){
    const ks=K();cur=ks[Math.floor(Math.random()*ks.length)][0];
    const L=level;const f=new Float32Array(N*N);
    const holes=[[70,120,22],[150,90,18]];
    const inPart=(i,j)=>{const u=(i-110)/88,v=(j-110)/68;if(Math.abs(u)>1||Math.abs(v)>1)return false;if(Math.abs(u)>0.75&&Math.abs(v)>0.7&&((Math.abs(u)-0.75)/0.25)**2+((Math.abs(v)-0.7)/0.3)**2>1)return false;return true;};
    for(let j=0;j<N;j++)for(let i=0;i<N;i++){let v=0.07;if(inPart(i,j))v=0.62;for(const h of holes)if((i-h[0])**2+(j-h[1])**2<h[2]**2)v=0.07;f[j*N+i]=v;}
    const free=()=>{for(let t=0;t<500;t++){const i=40+Math.random()*140,j=60+Math.random()*100;let ok=inPart(i,j);for(const h of holes)if(Math.hypot(i-h[0],j-h[1])<h[2]+16)ok=false;if(ok&&inPart(i+12,j)&&inPart(i-12,j)&&inPart(i,j+12)&&inPart(i,j-12))return [i,j];}return [110,140];};
    const disk=(a,b,r,val)=>{for(let j=Math.floor(b-r-1);j<=b+r+1;j++)for(let i=Math.floor(a-r-1);i<=a+r+1;i++){if(i<0||j<0||i>=N||j>=N)continue;if((i-a)**2+(j-b)**2<r*r)f[j*N+i]=val;}};
    const s=[1,0.62,0.4][L-1];
    if(cur==='GAS'){const [a,b]=free();disk(a,b,(5+Math.random()*4)*s,0.07);if(Math.random()<.5){const [c,d]=free();disk(c,d,2.5*s+0.6,0.07);}}
    if(cur==='LUNKER'){let [a,b]=free();const n=[45,32,22][L-1];for(let k=0;k<n;k++){disk(a,b,(1+Math.random()*2.2)*Math.max(0.6,s),0.07+Math.random()*0.25);a+=(Math.random()-.5)*5*s;b+=(Math.random()-.5)*5*s;}}
    if(cur==='EINSCHLUSS'){const [a,b]=free();for(let k=0;k<5;k++)disk(a+(Math.random()-.5)*4*s,b+(Math.random()-.5)*4*s,(1.8+Math.random()*1.5)*Math.max(0.55,s),L===3?0.85:1.0);}
    if(cur==='KERN'){const h=holes[Math.floor(Math.random()*2)];const ang=Math.random()*Math.PI;const w=[5,3.2,2][L-1]+Math.random()*1.5;
      for(let j=0;j<N;j++)for(let i=0;i<N;i++){const dx=i-h[0],dy=j-h[1];if(dx*dx+dy*dy<h[2]*h[2]){const d=Math.abs(-dx*Math.sin(ang)+dy*Math.cos(ang));if(d<w)f[j*N+i]=0.62;}}}
    const g=new Float32Array(N*N);for(let j=1;j<N-1;j++)for(let i=1;i<N-1;i++){let t=0;for(let b=-1;b<=1;b++)for(let a=-1;a<=1;a++)t+=f[(j+b)*N+i+a];g[j*N+i]=t/9;}
    const sig=[0.035,0.055,0.075][L-1];const im=x.createImageData(N,N);
    for(let k=0;k<N*N;k++){let v=g[k]+gauss()*sig;v=Math.max(0,Math.min(1,v))*255;im.data[k*4]=v;im.data[k*4+1]=Math.min(255,v+3);im.data[k*4+2]=Math.min(255,v+8);im.data[k*4+3]=255;}
    x.putImageData(im,0,0);
    document.getElementById('dfb').innerHTML='';
    document.querySelectorAll('#ans .qopt').forEach(b=>{b.classList.remove('ok','no');b.disabled=false;});
    sc();
  }
  function sc(){const key=level+(timed?'t':'');document.getElementById('sc').innerHTML=`<span class="pill" style="--ac:${V.gr}">RICHTIG ${score}/${total}</span><span class="pill" style="--ac:${V.gd}">SERIE ${streak}</span>${timed?`<span class="pill" style="--ac:${V.rd}">⏱ ${tLeft} S</span>`:''}<span class="pill" style="--ac:${V.li}">BEST ${store.detBest[key]||0}</span>`;}
  function answer(b){
    if(b.disabled||(timed&&tLeft<=0))return;const ok=b.dataset.k===cur;total++;if(ok){score++;streak++;}else streak=0;
    document.querySelectorAll('#ans .qopt').forEach(q=>{q.disabled=true;if(q.dataset.k===cur)q.classList.add('ok');});if(!ok)b.classList.add('no');
    const name=K().find(k=>k[0]===cur)[1];
    if(timed){sc();setTimeout(()=>{if(my===runId&&tLeft>0)gen();},550);return;}
    const key=String(level);if(streak>(store.detBest[key]||0)){store.detBest[key]=streak;save();}
    document.getElementById('dfb').innerHTML=`<div class="fb" style="border-color:${ok?V.gr:V.rd}"><b style="color:${ok?V.gr:V.rd}">${ok?'✓ RICHTIG!':'✗ LEIDER FALSCH'}</b> – Es war: <b>${name}</b>. ${EXPL[cur]}</div><button class="btn" style="margin-top:10px;width:100%" id="nx">NÄCHSTES BILD ›</button>`;
    document.getElementById('nx').onclick=gen;sc();
  }
  function reset(){clearInterval(timer);score=0;total=0;streak=0;buttons();
    if(timed){tLeft=60;gen();timer=setInterval(()=>{if(my!==runId||!document.getElementById('dg')){clearInterval(timer);return;}tLeft--;sc();if(tLeft<=0){clearInterval(timer);const key=level+'t';const nb=score>(store.detBest[key]||0);if(nb){store.detBest[key]=score;save();}
      document.querySelectorAll('#ans .qopt').forEach(q=>q.disabled=true);
      document.getElementById('dfb').innerHTML=`<div class="fb" style="border-color:${V.gd};text-align:center"><div class="mono" style="font-size:30px;font-weight:800;color:${V.gd}">${score} RICHTIG</div>in 60 Sekunden (${total} Antworten)${nb?' – <b>neuer Bestwert!</b>':''}</div><button class="btn" style="margin-top:10px;width:100%" id="nx">↺ NOCHMAL</button>`;document.getElementById('nx').onclick=reset;sc();}},1000);}
    else gen();}
  segBind('lv',v=>{level=+v;reset();});segBind('md',v=>{timed=v==='1';reset();});
  reset();
};
S.quiz.t='Prüfungsmodus';S.quiz.d=QZ.length+' Fragen in drei Stufen (leicht, mittel, schwer) – mit Bestwerten und Erklärung nach jeder Antwort.';
S.detektiv.d='Erkenne Gasporen, Lunker, Einschlüsse und Kernbruch in CT-Schnitten – 3 Levels und ein 60-Sekunden-Modus.';
LEX.push(
['Antastabweichung','Kenngröße für die Messgenauigkeit an einer Kugel – Form (PF) und Größe (PS), nach VDI/VDE 2630-1.3.'],
['Binning','Zusammenfassen mehrerer Detektorpixel: mehr Signal, weniger Auflösung.'],
['Cohens Kappa','Maß für die Übereinstimmung zweier Prüfer, bereinigt um Zufall.'],
['Dual-Energy-CT','Aufnahme mit zwei Spektren zur besseren Materialtrennung.'],
['Grenzmuster','Referenzteil oder -bild genau an der Grenze zwischen i.O. und n.i.O.'],
['Inline-CT','CT-Prüfung direkt in der Fertigungslinie im Takt.'],
['Kugelabstandsabweichung (SD)','Abweichung des gemessenen vom kalibrierten Abstand zweier Kugelmittelpunkte.'],
['Laminographie','Schräge Durchstrahlung für flache, große Bauteile.'],
['Messunsicherheit','Bereich, in dem der wahre Wert mit hoher Wahrscheinlichkeit liegt.'],
['Mittelung','Mehrere Bilder je Projektion addieren – weniger Rauschen, längere Scanzeit.'],
['Nachleuchten (Lag)','Restsignal des Szintillators aus dem vorherigen Bild.'],
['Prüfzone','Bereich eines Bauteils mit eigenen Grenzwerten, z. B. Dichtfläche.'],
['Sättigung','Detektorpixel am Maximalwert – Information geht verloren.'],
['SNR','Signal-Rausch-Verhältnis – steigt mit der Wurzel der Photonenzahl.'],
['Szintillator','Schicht im Detektor, die Röntgenstrahlung in Licht umwandelt (z. B. CsI, GOS).'],
['Truncation (Abschneiden)','Bauteil ragt aus dem Messfeld – führt zu Artefakten.'],
['Wärmeausdehnung','Aluminium dehnt sich um ca. 23 µm pro Meter und Kelvin aus.']
);LEX.sort((a,b)=>a[0].localeCompare(b[0],'de'));
TL.splice(TL.findIndex(t=>t[0]==='2021'),0,['2010er','CT als Messgerät','Die Richtlinienreihe VDI/VDE 2630 beschreibt, wie CT-Messanlagen geprüft und bewertet werden.',V.bl]);

render();
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
