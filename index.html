<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bayazit CT-Schule</title>
<meta name="theme-color" content="#05080d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CT-Schule">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05080d;--card:#0f1620;--surf:#0b1118;--line:#1b2532;
  --tx:#dfe6ef;--mut:#7f8b9c;
  --gr:#1fcf8f;--rd:#f0605d;--gd:#f5c542;--bl:#4c9aff;--li:#b388ff;--or:#ff9f43;
  --ac:var(--gr);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx)}
body{font-family:Inter,system-ui,sans-serif;font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
.mono{font-family:"JetBrains Mono",monospace}
h1,h2,h3,.lbl{font-family:"JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.06em;font-weight:800}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 80px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* Animation */
.fx{opacity:0;transform:translateY(12px);animation:up .55s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i,0)*70ms)}
@keyframes up{to{opacity:1;transform:none}}

/* Kopf Startseite */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.sub{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--mut);letter-spacing:.12em;text-transform:uppercase}
.hero h1{font-size:clamp(28px,7vw,46px);line-height:1.05;margin:6px 0 10px}
.hero h1 span{color:var(--gr);text-shadow:0 0 24px rgba(31,207,143,.35)}
.hero p{color:var(--mut);max-width:620px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gr);box-shadow:0 0 10px var(--gr);margin-right:8px;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.prog{margin:18px 0 22px;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.prog .row{display:flex;justify-content:space-between;font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--mut);letter-spacing:.08em;margin-bottom:8px}
.prog .row b{color:var(--gr)}
.bar{height:6px;background:#141d29;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px;box-shadow:0 0 10px var(--ac);transition:width .8s}

/* Bento */
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:1000px){.grid{grid-template-columns:1fr 1fr 1fr}.wide{grid-column:span 2}}
.tile{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 18px 16px;min-height:178px;display:flex;flex-direction:column;cursor:pointer;transition:transform .25s,border-color .25s,box-shadow .25s;text-align:left}
.tile::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--ac);box-shadow:0 0 14px var(--ac)}
.tile::after{content:"";position:absolute;right:-60px;top:-60px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,var(--ac) 0%,transparent 70%);opacity:.13;pointer-events:none}
.tile:hover,.tile:active,.tile:focus-visible{transform:translateY(-3px);border-color:var(--ac);box-shadow:0 10px 30px -12px var(--ac);outline:none}
.tile h3{color:var(--ac);font-size:17px;padding-right:56px}
.tile .tag{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--mut);letter-spacing:.14em;margin-bottom:6px}
.tile p{color:var(--mut);font-size:14.5px;margin-top:8px;flex:1}
.tile .ico{position:absolute;right:16px;top:18px;width:44px;height:44px;color:var(--ac);filter:drop-shadow(0 0 8px var(--ac))}
.tfoot{display:flex;align-items:center;gap:12px;margin-top:14px;font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--mut);letter-spacing:.08em}
.tfoot .bar{flex:1;height:5px}
.tfoot .arr{color:var(--ac);font-size:22px;line-height:1}
.fact{background:linear-gradient(135deg,rgba(245,197,66,.08),transparent 60%),var(--card);border:1px solid var(--line);border-left:3px solid var(--gd);border-radius:16px;padding:14px 16px;margin-bottom:16px;display:flex;gap:12px;align-items:flex-start}
.fact .lbl{color:var(--gd);font-size:11.5px}
.fact p{font-size:14.5px;margin-top:3px}
.fact button{margin-left:auto;font-family:"JetBrains Mono",monospace;color:var(--gd);font-size:12px;border:1px solid #3a3320;border-radius:10px;padding:5px 9px;white-space:nowrap}

/* Unterseiten */
.back{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:13px;color:var(--tx);border:1px solid var(--line);background:var(--surf);border-radius:12px;padding:8px 13px;letter-spacing:.06em;transition:border-color .2s}
.back:hover{border-color:var(--ac)}
.phead{margin:20px 0 18px}
.phead h2{color:var(--ac);font-size:clamp(26px,6vw,38px);line-height:1.1;margin-top:6px;text-shadow:0 0 26px color-mix(in srgb,var(--ac) 35%,transparent)}
.phead p{color:var(--mut);margin-top:8px;max-width:680px}
.sec{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--mut);letter-spacing:.16em;text-transform:uppercase;margin:26px 0 10px;display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;position:relative;overflow:hidden}
.panel h3{font-size:14px;color:var(--ac);margin-bottom:4px}
.panel .hint{color:var(--mut);font-size:13.5px;margin-bottom:12px}
.items{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:border-color .25s}
.item.open{border-color:color-mix(in srgb,var(--ac) 55%,var(--line))}
.ihead{display:flex;align-items:center;gap:13px;padding:13px 14px;width:100%;text-align:left}
.num{flex:none;width:40px;height:40px;border-radius:12px;background:var(--surf);border:1px solid var(--line);display:grid;place-items:center;font-family:"JetBrains Mono",monospace;font-weight:800;font-size:13px;color:var(--ac)}
.item.done .num{background:color-mix(in srgb,var(--gr) 14%,var(--surf));border-color:#1e5a44;color:var(--gr)}
.ihead .tt{flex:1;min-width:0}
.ihead b{display:block;font-weight:700;font-size:15.5px}
.ihead small{display:block;color:var(--mut);font-size:13px;line-height:1.35;margin-top:1px}
.chev{color:var(--mut);transition:transform .3s;font-size:18px}
.item.open .chev{transform:rotate(90deg);color:var(--ac)}
.ibody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s}
.item.open .ibody{grid-template-rows:1fr}
.ibody>div{overflow:hidden}
.ibody .in{padding:2px 16px 16px 16px;border-top:1px dashed var(--line);margin:0 14px;padding-left:0;padding-right:0;padding-top:14px}
.in p{margin-bottom:10px}
.in ul{margin:0 0 10px 18px}
.in li{margin-bottom:4px}
.in b{color:#fff}
.box{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin:10px 0}
.box .lbl{font-size:11px;margin-bottom:4px;color:var(--ac)}
.box.g .lbl{color:var(--gd)}.box.r .lbl{color:var(--rd)}.box.gr .lbl{color:var(--gr)}.box.b .lbl{color:var(--bl)}
.formula{font-family:"JetBrains Mono",monospace;font-size:15px;color:#fff;background:#070b11;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;overflow-x:auto;white-space:nowrap}
.mark{margin-top:6px;font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:700;letter-spacing:.08em;border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--mut)}
.item.done .mark{color:var(--gr);border-color:#1e5a44}
.check{color:var(--gr);font-weight:800;margin-left:6px}
.pill{display:inline-block;font-family:"JetBrains Mono",monospace;font-size:11.5px;font-weight:700;letter-spacing:.06em;padding:3px 9px;border-radius:99px;background:#070b11;border:1px solid var(--ac);color:var(--ac);white-space:nowrap}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.svgfig{width:100%;height:auto;display:block}
canvas{display:block;width:100%}
.ctl{display:grid;gap:12px;margin-top:12px}
.ctl label{display:flex;justify-content:space-between;font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.ctl label b{color:var(--ac);text-transform:none}
input[type=range]{width:100%;accent-color:var(--ac);height:22px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:700;padding:7px 11px;border-radius:10px;border:1px solid var(--line);background:var(--surf);color:var(--mut);letter-spacing:.04em}
.seg button.on{border-color:var(--ac);color:var(--ac);box-shadow:0 0 12px -4px var(--ac)}
.btn{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:13px;letter-spacing:.06em;padding:10px 14px;border-radius:12px;border:1px solid var(--ac);color:var(--ac);background:color-mix(in srgb,var(--ac) 10%,transparent);text-transform:uppercase}
.btn.ghost{border-color:var(--line);color:var(--mut);background:var(--surf)}
.row2{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:760px){.row2{grid-template-columns:1fr 1fr}}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cv{background:#070b11;border:1px solid var(--line);border-radius:12px;padding:6px;position:relative}
.cv .lbl{position:absolute;left:10px;top:9px;font-size:10px;z-index:2}
.cv canvas{border-radius:8px;image-rendering:pixelated}
.row3 .cv canvas{aspect-ratio:1/1;height:auto}
.row3 .cv .cap{display:block;text-align:center;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:10.5px;letter-spacing:.08em;margin-top:6px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:12px}
.kv div{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kv span{display:block;font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--mut);letter-spacing:.1em;text-transform:uppercase}
.kv b{font-family:"JetBrains Mono",monospace;font-size:19px;color:var(--ac)}
.num-in{width:100%;background:#070b11;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:9px 10px;font-family:"JetBrains Mono",monospace;font-size:15px}
.num-in:focus{outline:none;border-color:var(--ac)}
.next{margin-top:26px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
table.t{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
table.t th{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ac);text-align:left;letter-spacing:.08em;text-transform:uppercase;padding:6px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:7px 6px;border-bottom:1px dashed var(--line);vertical-align:top}
/* Zeitstrahl */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--li),var(--bl),var(--gr))}
.tli{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.tli::before{content:"";position:absolute;left:-23px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--ac);box-shadow:0 0 10px var(--ac)}
.tli .y{font-family:"JetBrains Mono",monospace;font-weight:800;color:var(--ac);font-size:18px}
.tli p{color:var(--mut);font-size:14.5px}
.tli b{color:var(--tx)}
/* Quiz */
.qopt{display:block;width:100%;text-align:left;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:15px;transition:border-color .2s,background .2s}
.qopt:hover{border-color:var(--ac)}
.qopt.ok{border-color:var(--gr);background:rgba(31,207,143,.1)}
.qopt.no{border-color:var(--rd);background:rgba(240,96,93,.1)}
.search{width:100%;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--tx);font-size:15.5px;margin-bottom:12px}
.search:focus{outline:none;border-color:var(--ac)}
.lex{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.lex b{font-family:"JetBrains Mono",monospace;color:var(--ac);text-transform:uppercase;letter-spacing:.05em;font-size:13.5px}
.lex p{color:var(--mut);font-size:14.5px;margin-top:2px}
.dose{display:grid;grid-template-columns:120px 1fr;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.dose .b{height:22px;border-radius:7px;background:var(--ac);opacity:.85;position:relative;transform-origin:left;animation:grow 1s cubic-bezier(.2,.7,.2,1) both}
.dose .b span{position:absolute;left:calc(100% + 6px);top:2px;white-space:nowrap}
@keyframes grow{from{transform:scaleX(0)}}
.fb{margin-top:10px;padding:11px 13px;border-radius:12px;font-size:14.5px;border:1px solid var(--line);background:var(--surf)}

/* Helles Design */
:root[data-theme=light]{--bg:#f2f5f9;--card:#ffffff;--surf:#eef2f7;--line:#d5dde7;--tx:#121a24;--mut:#5d6878;--gr:#0e9e6c;--rd:#d23f3b;--gd:#a87800;--bl:#2a72d8;--li:#7c4ddb;--or:#d06a0a}
[data-theme=light] .bar{background:#dde4ec}
[data-theme=light] .formula{background:#f6f8fb;color:#121a24}
[data-theme=light] .in b{color:#000}
[data-theme=light] .pill{background:#fff}
[data-theme=light] .num-in{background:#fff;color:#121a24}
[data-theme=light] .fact button{border-color:#e5d9b5}
[data-theme=light] .item.done .num,[data-theme=light] .item.done .mark{border-color:#9fd9c2}
[data-theme=light] .panel>canvas,[data-theme=light] .panel .svgfig{background:#0b1118;border-radius:12px}
[data-theme=light] .tile{box-shadow:0 1px 3px rgba(15,25,40,.06)}
[data-theme=light] .ihead small,[data-theme=light] .tile p{color:var(--mut)}
html{transition:background .3s}
body,.tile,.panel,.item,.box{transition:background-color .3s,border-color .3s,color .3s}
/* Umschalter */
.top{flex-wrap:wrap}
.theme{display:inline-flex;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.theme button{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:11px;letter-spacing:.06em;color:var(--mut);padding:6px 9px;border-radius:9px;white-space:nowrap}
.theme button.on{background:var(--card);color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset}
footer{color:var(--mut);font-size:12px;text-align:center;margin-top:40px;font-family:"JetBrains Mono",monospace;letter-spacing:.08em}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============== Grunddaten ============== */
const C={gr:'#1fcf8f',rd:'#f0605d',gd:'#f5c542',bl:'#4c9aff',li:'#b388ff',or:'#ff9f43'};
const V={gr:'var(--gr)',rd:'var(--rd)',gd:'var(--gd)',bl:'var(--bl)',li:'var(--li)',or:'var(--or)'};
const ICON={
 grundlagen:'<rect x="3" y="8" width="18" height="8" rx="4"/><path d="M7 12h3M14 10.5l2 1.5-2 1.5M11 16l-2 5M13.5 16l1 5M16 16l3 4"/>',
 wechsel:'<path d="M2 12c2-4 4-4 6 0s4 4 6 0 4-4 6 0"/><path d="M20 5v14"/>',
 ct:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.2"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>',
 labor:'<path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 12l9-5M12 12v10M12 12L3 7"/>',
 industrie:'<rect x="3" y="7" width="18" height="12" rx="2"/><circle cx="8" cy="13" r="2.5"/><circle cx="16" cy="13" r="2.5"/><path d="M7 7V4h10v3"/>',
 detektiv:'<circle cx="10" cy="10" r="6.5"/><path d="M15 15l6 6"/><circle cx="10" cy="10" r="1.6"/>',
 artefakte:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.4"/>',
 schutz:'<path d="M12 2l8 4v6c0 5-4 9-8 10-4-1-8-5-8-10V6z"/><path d="M9 12l2 2 4-4"/>',
 geschichte:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
 quiz:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.7v.5M12 17v.4"/>',
 lexikon:'<path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4z"/><path d="M20 4h-4a3 3 0 0 0-3 3"/><path d="M20 4v14h-5"/>'
};
const ico=(k)=>'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+ICON[k]+'</svg>';

let store={done:{},best:0,theme:'auto'};
try{const s=JSON.parse(localStorage.getItem('ctschule')||'null');if(s)store=Object.assign(store,s);}catch(e){}
function save(){try{localStorage.setItem('ctschule',JSON.stringify(store));}catch(e){}}

/* ============== Inhalte ============== */
const S={};

S.grundlagen={t:'Röntgen-Grundlagen',c:'bl',tag:'MODUL 01',d:'Wie entsteht Röntgenstrahlung? Röhre, Spektrum, kV und mA – mit Live-Spektrum zum Ausprobieren.',
items:[
['Die Entdeckung 1895','Würzburg, ein dunkles Labor und ein leuchtender Schirm',`<p>Am <b>8. November 1895</b> bemerkte <b>Wilhelm Conrad Röntgen</b> in Würzburg, dass ein Leuchtschirm aufleuchtete, obwohl seine Kathodenstrahlröhre mit schwarzem Karton abgedeckt war. Er nannte die unbekannte Strahlung <b>„X-Strahlen“</b>.</p><p>Am 22. Dezember 1895 entstand das berühmte Bild der Hand seiner Frau <b>Anna Bertha</b> – mit Ehering. 1901 erhielt Röntgen den allerersten <b>Nobelpreis für Physik</b>.</p><div class="box g"><div class="lbl">Gut zu wissen</div>Röntgen hat seine Entdeckung bewusst nicht patentiert – sie sollte der ganzen Menschheit nützen.</div>`],
['Was ist Röntgenstrahlung?','Licht – nur viel energiereicher',`<p>Röntgenstrahlung ist <b>elektromagnetische Strahlung</b> wie sichtbares Licht, aber mit sehr viel kürzerer Wellenlänge (ca. 10 nm bis unter 1 pm) und viel höherer Energie.</p><div class="formula">E [keV] ≈ 1,24 / λ [nm]</div><p>Sie besteht aus Photonen (Energiepaketen). Weil sie Atome <b>ionisieren</b> kann, durchdringt sie Material – und ist gleichzeitig gesundheitlich relevant.</p><div class="box b"><div class="lbl">Vergleich</div>Sichtbares Licht: ca. 2–3 eV · Röntgen in der Industrie-CT: ca. 20–450 keV – also rund 10.000- bis 100.000-mal energiereicher.</div>`],
['Die Röntgenröhre','Kathode, Hochspannung, Anode',`<p>Eine Glühwendel (<b>Kathode</b>) gibt Elektronen ab. Die <b>Hochspannung</b> (kV) beschleunigt sie auf die <b>Anode</b> (meist Wolfram). Beim Aufprall entsteht Röntgenstrahlung.</p><ul><li>Nur ca. <b>1 %</b> der Energie wird zu Röntgenstrahlung, ca. <b>99 %</b> zu Wärme.</li><li>Deshalb braucht jede Röhre eine Kühlung.</li><li>Industrie-CT nutzt oft <b>offene Mikrofokusröhren</b> (sehr kleiner Brennfleck, Wolfram-Target austauschbar) oder geschlossene Röhren für hohe Leistung.</li></ul>`],
['Bremsstrahlung','Das kontinuierliche Spektrum',`<p>Wenn ein Elektron im elektrischen Feld eines Atomkerns abgebremst wird, gibt es Energie als Photon ab. Weil es unterschiedlich stark abgebremst wird, entsteht ein <b>kontinuierliches Spektrum</b>.</p><div class="formula">E_max = e · U   →   225 kV ergibt max. 225 keV</div><p>Die meisten Photonen haben aber deutlich weniger Energie – der Mittelwert liegt grob bei einem Drittel bis der Hälfte von E_max (abhängig vom Filter).</p>`],
['Charakteristische Strahlung','Die scharfen „Spitzen“ im Spektrum',`<p>Schlägt ein Elektron ein Elektron aus der innersten Schale (K-Schale) des Anodenatoms heraus, fällt ein äußeres Elektron nach – dabei entsteht ein Photon mit genau festgelegter Energie.</p><div class="box"><div class="lbl">Wolfram</div>Kα ≈ 59 keV · Kβ ≈ 67 keV · erst sichtbar ab ca. <b>69,5 kV</b> Röhrenspannung (K-Kante).</div>`],
['kV oder mA – was macht was?','Härte vs. Menge',`<table class="t"><tr><th>Regler</th><th>Wirkung</th></tr><tr><td><b>Spannung (kV)</b></td><td>Höhere Photonenenergie → mehr Durchdringung, weniger Kontrast; außerdem mehr Intensität</td></tr><tr><td><b>Strom (mA / µA)</b></td><td>Nur mehr Photonen (helleres Bild, weniger Rauschen) – die Energie bleibt gleich</td></tr></table><div class="formula">Leistung P = U · I   (z. B. 200 kV · 0,1 mA = 20 W)</div><div class="box g"><div class="lbl">Praxis</div>Mehr Leistung = größerer Brennfleck = mehr Unschärfe. Bei Mikrofokusröhren begrenzt die Leistung daher die erreichbare Auflösung.</div>`],
['Der Brennfleck','Warum klein so wichtig ist',`<p>Der Brennfleck ist die Fläche auf der Anode, von der die Strahlung ausgeht. Ist er groß, entsteht ein <b>Halbschatten</b> – die geometrische Unschärfe.</p><div class="formula">U_g = f · (M − 1)</div><p>Beispiel: Brennfleck f = 50 µm, Vergrößerung M = 5 → 200 µm Unschärfe am Detektor, das sind <b>40 µm im Bauteil</b>. Wer feine Poren sehen will, braucht einen kleinen Brennfleck.</p><div class="box g"><div class="lbl">450-kV-Anlagen</div>Typische 450-kV-Röhren haben zwei Brennflecke, z. B. <b>0,4 mm</b> (bis ca. 700 W) und <b>1,0 mm</b> (bis ca. 1500 W). Der kleine Fokus ist schärfer, der große bringt mehr Leistung für dicke Bauteile wie Kurbelgehäuse. Die genauen Werte stehen im Datenblatt eurer Röhre.</div>`],
['Vorfilter','Weiche Strahlung herausfiltern',`<p>Ein dünnes Metallblech direkt vor der Röhre (z. B. <b>Kupfer, Zinn, Aluminium</b>) schluckt die energiearmen Photonen, die das Bauteil sowieso kaum durchdringen.</p><ul><li><b>Vorteil:</b> weniger Strahlaufhärtung (Cupping), gleichmäßigere Grauwerte</li><li><b>Nachteil:</b> weniger Intensität → längere Belichtung oder mehr Rauschen</li></ul><div class="box"><div class="lbl">Probier es aus</div>Oben im Live-Spektrum siehst du, wie der Filter die linke Seite des Spektrums „abschneidet“.</div>`]
]};

S.wechsel={t:'Strahlung & Materie',c:'li',tag:'MODUL 02',d:'Warum Aluminium hell und Poren dunkel erscheinen: Schwächung, Photoeffekt, Compton und Halbwertsdicke.',
items:[
['Das Schwächungsgesetz','Lambert-Beer',`<p>Durchläuft Strahlung Material, wird sie exponentiell schwächer:</p><div class="formula">I = I₀ · e^(−μ · d)</div><p><b>μ</b> ist der Schwächungskoeffizient (abhängig von Material, Dichte und Energie), <b>d</b> die Dicke. Genau dieses μ rekonstruiert die CT für jedes Voxel – das ist der <b>Grauwert</b>.</p>`],
['Photoeffekt','Das Photon wird komplett geschluckt',`<p>Das Photon gibt seine ganze Energie an ein Hüllenelektron ab und verschwindet. Dominant bei <b>niedriger Energie</b> und <b>hoher Ordnungszahl Z</b> (grob ∝ Z³/E³).</p><div class="box gr"><div class="lbl">Bedeutung</div>Der Photoeffekt liefert den meisten <b>Kontrast</b> zwischen verschiedenen Materialien.</div>`],
['Compton-Streuung','Das Photon prallt ab',`<p>Das Photon gibt nur einen Teil seiner Energie ab und fliegt in eine andere Richtung weiter. Bei Aluminium ist Compton ab ca. <b>50 keV</b> der wichtigste Effekt.</p><div class="box r"><div class="lbl">Problem</div>Gestreute Photonen landen irgendwo auf dem Detektor → <b>Streustrahlung</b>, weniger Kontrast, verfälschte Grauwerte.</div>`],
['Paarbildung','Erst ab 1,022 MeV',`<p>Ein sehr energiereiches Photon wandelt sich in der Nähe eines Kerns in ein Elektron und ein Positron um. Das spielt nur bei <b>Linearbeschleunigern</b> (MeV-CT für sehr große Bauteile) eine Rolle – nicht bei normalen Röhren bis 450 kV.</p>`],
['Halbwertsdicke','Nach welcher Dicke ist die Hälfte weg?',`<div class="formula">d½ = ln 2 / μ ≈ 0,693 / μ</div><table class="t"><tr><th>Material</th><th>d½ bei 100 keV (ca.)</th></tr><tr><td>Kunststoff</td><td>~ 36 mm</td></tr><tr><td>Aluminium</td><td>~ 15 mm</td></tr><tr><td>Titan</td><td>~ 5,7 mm</td></tr><tr><td>Stahl</td><td>~ 2,4 mm</td></tr><tr><td>Kupfer</td><td>~ 1,7 mm</td></tr><tr><td>Blei</td><td>~ 0,1 mm</td></tr></table><p>Darum lassen sich Aluminium-Gussteile so gut durchstrahlen – und Stahl braucht viel mehr kV.</p>`],
['Dichte & Ordnungszahl','Warum manches im CT fast unsichtbar ist',`<table class="t"><tr><th>Stoff</th><th>Dichte g/cm³</th><th>Im CT</th></tr><tr><td>Luft (Pore)</td><td>0,0012</td><td>schwarz</td></tr><tr><td>Silizium</td><td>2,33</td><td>fast wie Al</td></tr><tr><td>Aluminium</td><td>2,70</td><td>grau</td></tr><tr><td>Eisen</td><td>7,87</td><td>sehr hell</td></tr></table><div class="box g"><div class="lbl">Aha!</div>Silizium und Aluminium liegen so nah beieinander, dass Si-Ausscheidungen in AlSi-Legierungen kaum Kontrast haben. Auch <b>Oxidhäute</b> sind oft schwer zu sehen – sie sind sehr dünn und kaum dichter als Aluminium.</div>`]
]};

S.ct={t:'CT-Prinzip',c:'gr',tag:'MODUL 03',d:'Von vielen Röntgenbildern zum 3D-Volumen: Projektion, Sinogramm und Rückprojektion – animiert.',
items:[
['Von 2D zu 3D','Warum ein Röntgenbild nicht reicht',`<p>Ein normales Röntgenbild ist ein <b>Schattenbild</b>: alles, was hintereinander liegt, überlagert sich. Man sieht nicht, in welcher Tiefe eine Pore sitzt.</p><p>Die CT nimmt deshalb <b>hunderte bis tausende Projektionen</b> aus allen Richtungen auf und berechnet daraus das Innere – Schicht für Schicht bzw. als 3D-Volumen.</p>`],
['Projektion & Sinogramm','Jeder Punkt malt eine Sinuskurve',`<p>Eine <b>Projektion</b> ist ein Röntgenbild aus einem bestimmten Winkel. Legt man die Detektorzeilen aller Winkel untereinander, entsteht das <b>Sinogramm</b>.</p><p>Ein einzelner Punkt im Objekt wandert beim Drehen auf dem Detektor hin und her – im Sinogramm entsteht eine <b>Sinuskurve</b>. Daher der Name.</p><div class="box"><div class="lbl">Mathematik</div>Das Sinogramm ist die <b>Radon-Transformation</b> des Objekts – beschrieben 1917 von Johann Radon.</div>`],
['Einfache Rückprojektion','Alles zurück verschmieren',`<p>Jeder Messwert wird entlang seines Strahls zurück über das Bild „verschmiert“. Wo sich viele Strahlen treffen, entsteht das Objekt.</p><div class="box r"><div class="lbl">Problem</div>Das Ergebnis ist stark <b>unscharf</b> – jeder Punkt bekommt einen sternförmigen Schleier. Im CT-Labor kannst du das mit „Filter aus“ sehen.</div>`],
['Gefilterte Rückprojektion','Der Trick mit dem Rampenfilter',`<p>Vor dem Zurückprojizieren wird jede Projektion mit einem <b>Rampenfilter</b> bearbeitet. Er verstärkt Kanten und erzeugt negative „Gegenschatten“, die den Schleier genau aufheben.</p><div class="formula">Bild = Σ Rückprojektion( Projektion ⊛ Rampenfilter )</div><p>Diese <b>FBP</b> (Filtered Back Projection) ist bis heute der Standard.</p>`],
['Kegelstrahl & Feldkamp','So arbeitet deine Industrie-CT',`<p>Mit Flachdetektor wird ein <b>kegelförmiger Strahl</b> genutzt – mit einer Umdrehung entsteht das ganze 3D-Volumen.</p><p>Der Rekonstruktionsalgorithmus dafür ist der <b>Feldkamp-Algorithmus (FDK)</b> von Feldkamp, Davis und Kress (1984) – eine Erweiterung der gefilterten Rückprojektion auf 3D.</p>`],
['Voxel & Grauwerte','Die Bausteine des Volumens',`<p>Ein <b>Voxel</b> ist ein 3D-Pixel. Jeder Voxel hat einen <b>Grauwert</b>, der dem Schwächungskoeffizienten μ entspricht. In der Industrie meist 16 Bit: 0–65.535.</p><p>In der Medizin werden Grauwerte in <b>Hounsfield-Einheiten</b> angegeben:</p><div class="formula">HU = 1000 · (μ − μ_Wasser) / (μ_Wasser − μ_Luft)</div><p>Luft = −1000 HU · Wasser = 0 HU · Knochen ca. +1000 HU und mehr.</p>`],
['Iterative Rekonstruktion','Rechnen, vergleichen, verbessern',`<p>Statt einmal zurückzuprojizieren, wird ein Volumen geschätzt, daraus Projektionen simuliert, mit den Messungen verglichen und korrigiert – immer wieder (z. B. ART, SART).</p><ul><li><b>Vorteil:</b> weniger Rauschen und Artefakte, weniger Projektionen nötig</li><li><b>Nachteil:</b> deutlich mehr Rechenzeit</li></ul>`],
['Medizin vs. Industrie','Gleiche Physik, andere Welt',`<table class="t"><tr><th></th><th>Medizin</th><th>Industrie</th></tr><tr><td>Was dreht?</td><td>Röhre + Detektor (Gantry)</td><td>Bauteil (Drehteller)</td></tr><tr><td>Spannung</td><td>ca. 70–140 kV</td><td>ca. 20–450 kV, MeV mit Linac</td></tr><tr><td>Dosis</td><td>so gering wie möglich</td><td>egal – Bauteil lebt nicht</td></tr><tr><td>Auflösung</td><td>ca. 0,3–0,6 mm</td><td>bis in den µm-Bereich</td></tr><tr><td>Scanzeit</td><td>Sekunden</td><td>Minuten bis Stunden</td></tr></table>`]
]};

S.labor={t:'CT-Labor',c:'bl',tag:'SIMULATION',d:'Überraschung: Rekonstruiere selbst einen CT-Schnitt – Winkel für Winkel, mit und ohne Filter.',tool:true,items:[]};

S.industrie={t:'Industrie-CT',c:'or',tag:'MODUL 04',d:'Dein Arbeitsalltag: Geometrie-Rechner, Scan-Ablauf, Porositätsanalyse, Soll-Ist-Vergleich, Wanddicke und Normen.',
items:[
['Aufbau einer Industrie-CT','Röhre · Drehteller · Detektor · Kabine',`<ul><li><b>Röntgenröhre</b> – Mikrofokus (feine Details) oder Makrofokus (dicke Bauteile, hohe Leistung)</li><li><b>Manipulator mit Drehteller</b> – bewegt und dreht das Bauteil; Abstand zur Röhre bestimmt die Vergrößerung</li><li><b>Flachdetektor</b> – Szintillator wandelt Röntgen in Licht, darunter eine Pixelmatrix</li><li><b>Strahlenschutzkabine</b> – Blei/Stahl, Türkontakte, Warnleuchte</li><li><b>Rekonstruktions-PC</b> und Auswertesoftware, z. B. <b>VGStudio MAX</b></li></ul>`],
['Vergrößerung & Voxelgröße','Die wichtigste Rechnung',`<div class="formula">M = FDD / FOD</div><div class="formula">Voxelgröße = Pixelgröße / M</div><div class="formula">Messfeld ≈ (Pixelanzahl · Pixelgröße) / M</div><p><b>FOD</b> = Abstand Fokus–Objekt, <b>FDD</b> = Abstand Fokus–Detektor. Je näher das Bauteil an der Röhre, desto feiner die Voxel – aber desto kleiner das Messfeld.</p><div class="box g"><div class="lbl">Merke</div>Ein großes Kurbelgehäuse muss ganz ins Messfeld passen → größere Voxel. Für feine Porositäten kann man einen <b>Teilbereich (ROI-Scan)</b> näher an der Röhre scannen.</div>`],
['Ablauf eines Scans','Vom Einspannen bis zum Bericht',`<ul><li><b>1. Einspannen</b> – stabil, oft schräg gestellt (gegen Kegelstrahlartefakte), Halter aus Schaum/Kunststoff</li><li><b>2. Parameter</b> – kV, µA, Vorfilter, Belichtungszeit, Anzahl Projektionen, Mittelung</li><li><b>3. Kalibrierung</b> – Hell- und Dunkelbild (Gain/Offset) für gleichmäßige Pixel</li><li><b>4. Scan</b> – Drehung um 360°, z. B. 1.000–3.000 Projektionen</li><li><b>5. Rekonstruktion</b> – FDK, Strahlaufhärtungskorrektur</li><li><b>6. Auswertung</b> – Oberfläche, Porosität, Soll-Ist, Wanddicke</li><li><b>7. Bericht</b> – i.O./n.i.O., Bilder, Kennwerte</li></ul>`],
['Oberflächenbestimmung','Wo hört das Aluminium auf?',`<p>Bevor gemessen werden kann, muss die Software entscheiden, wo die Grenze Material/Luft liegt.</p><ul><li><b>ISO-50</b>: Schwelle genau in der Mitte zwischen Grauwert von Luft und Material – einfach, aber global</li><li><b>Erweiterte (lokal adaptive) Oberflächenbestimmung</b>: sucht die Kante lokal neu – genauer bei Strahlaufhärtung und unterschiedlichen Wandstärken</li></ul><div class="box"><div class="lbl">Wichtig</div>Eine gute Oberfläche ist die Grundlage für jede Messung – Soll-Ist, Wanddicke und Porenvolumen.</div>`],
['Porositäts- & Defektanalyse','Poren finden, messen, bewerten',`<p>In VGStudio MAX sucht die Defektanalyse automatisch nach Hohlräumen und Einschlüssen. Je nach Version gibt es mehrere Algorithmen (z. B. <b>VGEasyPore</b>, <b>VGDefX</b>, „Only Threshold“).</p><table class="t"><tr><th>Kennwert</th><th>Bedeutung</th></tr><tr><td>Volumen</td><td>Größe des Defekts in mm³</td></tr><tr><td>Durchmesser</td><td>meist größte Ausdehnung</td></tr><tr><td>Sphärizität</td><td>wie kugelig (1 = Kugel) → Gas oder Lunker?</td></tr><tr><td>Kompaktheit</td><td>Verhältnis zu umhüllender Kugel</td></tr><tr><td>Abstand zur Oberfläche</td><td>kritisch bei Dichtflächen und Bearbeitung</td></tr></table><div class="box g"><div class="lbl">Tipp</div>Mit <b>Prüfzonen</b> (z. B. Dichtfläche, Lagergasse) lassen sich je Bereich eigene Grenzwerte festlegen.</div>`],
['Soll-Ist-Vergleich','Bauteil gegen CAD',`<p>Das gescannte Bauteil wird auf das CAD-Modell (Soll) ausgerichtet und die Abweichung farbig dargestellt.</p><ul><li><b>Registrierung:</b> Best-Fit, 3-2-1 oder RPS (Referenzpunktsystem)</li><li><b>Farbskala:</b> grün = in Toleranz, rot = zu viel Material, blau = zu wenig Material</li><li>Typische Fragen: Kernversatz? Verzug? Aufmaß für die Bearbeitung ausreichend?</li></ul>`],
['Wanddickenanalyse','Wo wird es zu dünn?',`<p>Gerade bei Wassermänteln und Kanälen ist die minimale Wandstärke entscheidend.</p><ul><li><b>Strahlmethode:</b> misst von jedem Oberflächenpunkt senkrecht durch das Material bis zur Gegenseite</li><li><b>Kugelmethode:</b> größte Kugel, die an dieser Stelle ins Material passt – robuster bei Rundungen</li></ul><div class="box"><div class="lbl">Praxis</div>Ein Kernversatz zeigt sich oft als eine Seite zu dünn, die andere zu dick.</div>`],
['Normen & Richtlinien','Was du kennen solltest',`<table class="t"><tr><th>Regelwerk</th><th>Inhalt</th></tr><tr><td>DIN EN ISO 15708</td><td>Zerstörungsfreie Prüfung – Computertomographie (Begriffe, Verfahren, Prüfung)</td></tr><tr><td>VDI/VDE 2630</td><td>CT in der dimensionellen Messtechnik</td></tr><tr><td>BDG-Richtlinie P 202</td><td>Volumendefizite von Gussteilen (Porosität bewerten)</td></tr><tr><td>DIN EN ISO 17636 / 5579</td><td>Klassische Durchstrahlungsprüfung (Film/Digital)</td></tr></table><div class="box g"><div class="lbl">Hinweis</div>Welche Fassung bei euch gilt, steht in den Prüfvorschriften bzw. Zeichnungen des Bauteils.</div>`]
]};

S.detektiv={t:'Fehler-Detektiv',c:'rd',tag:'SPIEL + KATALOG',d:'Erkenne Gasporen, Lunker, Einschlüsse und Kernbruch in simulierten CT-Schnitten – wie bei der Arbeit.',
items:[
['Gasporosität','Rund, glatt, oft einzeln',`<p>Entsteht durch Gas – vor allem <b>Wasserstoff</b>, eingeschlossene Luft oder verdampftes Trennmittel.</p><ul><li>Form: <b>rund bis oval</b>, glatte Wände</li><li>Hohe <b>Sphärizität</b> in der Defektanalyse</li><li>Oft verteilt oder nahe der Oberfläche</li></ul>`],
['Schwindungslunker','Zerklüftet, schwammartig',`<p>Beim Erstarren schrumpft Aluminium. Fehlt Nachspeisung, entstehen Hohlräume an den Stellen, die <b>zuletzt erstarren</b> – an Materialanhäufungen („Hot Spots“).</p><ul><li>Form: <b>verästelt, dendritisch, schwammig</b></li><li>Niedrige Sphärizität</li><li>Abhilfe in der Gießerei: Speiser, Kühlung, Wanddickenübergänge</li></ul>`],
['Einschlüsse','Hell oder kaum sichtbar',`<ul><li><b>Dichte Fremdkörper</b> (z. B. Eisen, Schlichtereste): deutlich <b>heller</b> als Aluminium</li><li><b>Oxidhäute</b>: sehr dünn, kaum Kontrast – oft nur durch begleitende Poren erkennbar</li><li><b>Sandeinschlüsse</b> (vom Kern): etwas dunkler als Aluminium</li></ul>`],
['Kernbruch & Kernversatz','Wenn der Sandkern versagt',`<p>Zylinderköpfe und Kurbelgehäuse haben Kanäle aus <b>Sandkernen</b> (z. B. Wassermantel, Ölkanäle).</p><ul><li><b>Kernbruch:</b> der Kern bricht, Metall fließt in den Kanal → <b>Materialbrücke</b> oder Verstopfung</li><li><b>Kernversatz:</b> Kern sitzt verschoben → eine Wand zu dünn</li><li>Nachweis: Schnittbilder, Soll-Ist-Vergleich, Wanddickenanalyse</li></ul>`],
['Kaltlauf','Zwei Fronten, die nicht verschmelzen',`<p>Zwei Schmelzefronten treffen zu kalt aufeinander und verbinden sich nicht richtig. Im CT oft nur als <b>feiner Spalt oder Linie</b> sichtbar – braucht gute Auflösung.</p>`],
['Risse (Warmrisse)','Feine, scharfe Linien',`<p>Entstehen beim Erstarren durch Spannungen, oft an Übergängen und Kerben. Im CT sehr feine, scharfkantige Linien – oft an der Grenze der Auflösung.</p><div class="box r"><div class="lbl">Grenze</div>Defekte kleiner als ca. <b>2–3 Voxel</b> sind nicht sicher erkennbar (Teilvolumeneffekt).</div>`]
]};

S.artefakte={t:'Artefakte',c:'rd',tag:'MODUL 05',d:'Was im Bild ist, aber nicht im Bauteil: Cupping, Ringe, Streifen, Kegelstrahl – und was dagegen hilft.',
items:[
['Strahlaufhärtung (Cupping)','Die Mitte wird dunkler',`ART:cup<p>Weiche Photonen werden zuerst geschluckt – das Spektrum wird beim Durchgang „härter“. Dicke Bereiche erscheinen dadurch <b>zu durchlässig</b> → in der Mitte dunkler, Ränder heller.</p><div class="box gr"><div class="lbl">Gegenmittel</div>Vorfilter (Cu/Sn) · Strahlaufhärtungskorrektur in der Rekonstruktion · lokal adaptive Oberflächenbestimmung</div>`],
['Streifenartefakte','Dunkle Balken zwischen dichten Bereichen',`ART:streak<p>Entstehen bei <b>sehr langen Durchstrahlungslängen</b> oder dichten Einsätzen (z. B. Stahlbuchsen in Aluminium): Zu wenig Photonen kommen an, die Messwerte sind fehlerhaft.</p><div class="box gr"><div class="lbl">Gegenmittel</div>Höhere kV · Bauteil anders orientieren · stärkerer Filter · Metallartefaktreduktion (MAR)</div>`],
['Ringartefakte','Kreise um die Drehachse',`ART:ring<p>Ein <b>defekter oder schlecht kalibrierter Detektorpixel</b> liefert in jeder Projektion denselben Fehler → in der Rekonstruktion entsteht ein Kreis um die Drehachse.</p><div class="box gr"><div class="lbl">Gegenmittel</div>Neue Hell-/Dunkelkalibrierung · Defektpixelkorrektur · Detektorverschiebung während des Scans · Ringartefaktkorrektur</div>`],
['Kegelstrahlartefakte','Probleme weit weg von der Mittelebene',`ART:cone<p>Beim Kegelstrahl ist nur die mittlere Ebene mathematisch vollständig erfasst. Flächen <b>senkrecht zur Drehachse</b>, weit oben oder unten, werden verwaschen.</p><div class="box gr"><div class="lbl">Gegenmittel</div>Bauteil <b>schräg</b> stellen · wichtige Bereiche in die Mittelebene · Helix-CT</div>`],
['Bewegungsartefakte','Verdoppelte oder unscharfe Kanten',`ART:motion<p>Wackelt das Bauteil oder verschiebt sich der Brennfleck durch Erwärmung, passen die Projektionen nicht zusammen.</p><div class="box gr"><div class="lbl">Gegenmittel</div>Feste Einspannung · Röhre vorher aufwärmen · Driftkorrektur · Raumtemperatur stabil halten</div>`],
['Streustrahlung','Grauer Schleier, weniger Kontrast',`ART:scatter<p>Compton-gestreute Photonen treffen den Detektor an falschen Stellen. Besonders stark bei großen, massigen Bauteilen.</p><div class="box gr"><div class="lbl">Gegenmittel</div>Kollimation (Strahl eng begrenzen) · größerer Abstand Bauteil–Detektor · Streustrahlkorrektur</div>`],
['Rauschen','Körniges Bild',`ART:noise<p>Zu wenige Photonen pro Pixel → statistische Schwankung. Kleine Poren gehen im Rauschen unter.</p><div class="box gr"><div class="lbl">Gegenmittel</div>Längere Belichtung · Mittelung mehrerer Bilder · mehr Projektionen · höherer Strom (Brennfleck beachten!)</div>`],
['Teilvolumeneffekt','Wenn ein Voxel halb voll ist',`ART:pve<p>Liegt eine Kante mitten in einem Voxel, bekommt er einen <b>Mischgrauwert</b>. Kleine Poren erscheinen dadurch grau statt schwarz – und kleiner oder gar nicht.</p><div class="box r"><div class="lbl">Faustregel</div>Sicher erkennbar ab ca. 2–3 Voxel Durchmesser; für zuverlässige Größenmessung eher mehr.</div>`]
]};

S.schutz={t:'Strahlenschutz',c:'gd',tag:'MODUL 06',d:'Gray, Sievert, die 3 A und das Abstandsquadratgesetz – mit Dosisvergleich und Rechner.',
items:[
['Die Einheiten','Gray, Sievert, Becquerel',`<table class="t"><tr><th>Größe</th><th>Einheit</th><th>Bedeutung</th></tr><tr><td>Energiedosis</td><td>Gray (Gy)</td><td>Energie pro kg Material (J/kg)</td></tr><tr><td>Effektive Dosis</td><td>Sievert (Sv)</td><td>biologische Wirkung auf den Menschen</td></tr><tr><td>Dosisleistung</td><td>µSv/h</td><td>Dosis pro Zeit – das zeigt ein Messgerät an</td></tr><tr><td>Aktivität</td><td>Becquerel (Bq)</td><td>Zerfälle pro Sekunde – nur bei radioaktiven Stoffen</td></tr></table>`],
['Die 3 A','Abstand · Abschirmung · Aufenthaltsdauer',`<ul><li><b>Abstand:</b> doppelter Abstand = nur noch ein Viertel der Dosis</li><li><b>Abschirmung:</b> Blei, Stahl, Beton zwischen Quelle und Mensch</li><li><b>Aufenthaltsdauer:</b> halbe Zeit = halbe Dosis</li></ul><p>Manchmal wird noch ein viertes A genannt: <b>Aktivität</b> (bzw. Leistung) so gering wie nötig.</p>`],
['Abstandsquadratgesetz','Warum Abstand so viel bringt',`<div class="formula">D₂ = D₁ · (r₁ / r₂)²</div><p>Die Strahlung verteilt sich auf eine immer größere Kugelfläche. Bei 3-fachem Abstand bleibt nur 1/9 übrig. Probier es oben im Rechner aus.</p>`],
['Röhre aus = Strahlung aus','Der große Unterschied zu radioaktiven Quellen',`<p>Eine Röntgenröhre erzeugt Strahlung <b>nur, solange Hochspannung anliegt</b>. Ausgeschaltet strahlt sie nicht, und das Bauteil wird durch Röntgenstrahlung auch <b>nicht radioaktiv</b>.</p><div class="box g"><div class="lbl">Sicherheit</div>Türkontakte (Interlocks) schalten die Hochspannung beim Öffnen ab. Warnleuchten zeigen „Strahlung ein“. Sicherheitseinrichtungen niemals überbrücken!</div>`],
['Gesetz & Grenzwerte','StrlSchG und StrlSchV',`<ul><li><b>Strahlenschutzgesetz (StrlSchG)</b> und <b>Strahlenschutzverordnung (StrlSchV)</b> regeln den Betrieb</li><li>Grenzwert <b>Bevölkerung:</b> 1 mSv pro Jahr (zusätzlich zur natürlichen Strahlung)</li><li>Grenzwert <b>beruflich exponierte Personen:</b> 20 mSv pro Jahr</li><li>Ein <b>Strahlenschutzbeauftragter</b> ist verantwortlich; Unterweisung mindestens jährlich</li><li>Vollschutzgeräte und Kabinen müssen außen sehr niedrige Ortsdosisleistungen einhalten</li></ul>`],
['Biologische Wirkung','Deterministisch und stochastisch',`<ul><li><b>Deterministische Wirkung:</b> erst ab einer Schwellendosis (hohe Dosen, z. B. Hautrötung)</li><li><b>Stochastische Wirkung:</b> keine Schwelle angenommen – das Risiko (z. B. Krebs) steigt mit der Dosis. Deshalb gilt: <b>so wenig wie vernünftigerweise möglich</b> (ALARA)</li></ul>`]
]};

S.detektor={t:'Detektor & Bildqualität',c:'li',tag:'MODUL 07',d:'Szintillator, Belichtung, Mittelung, Binning, Rauschen – mit Live-Rechner für die Bildqualität.',
items:[
['Aufbau eines Flachdetektors','Szintillator + Pixelmatrix',`<p>Röntgenstrahlung lässt sich nicht direkt „fotografieren“. Deshalb wandelt ein <b>Szintillator</b> sie zuerst in sichtbares Licht um, z. B. nadelförmiges <b>Cäsiumiodid (CsI)</b> oder <b>Gadoliniumoxysulfid (GOS)</b>.</p><p>Darunter liegt eine Matrix aus <b>Fotodioden</b> (amorphes Silizium oder CMOS), die das Licht in ein elektrisches Signal umwandelt.</p><table class="t"><tr><th>Typische Werte</th><th></th></tr><tr><td>Pixelgröße</td><td>ca. 75–200 µm</td></tr><tr><td>Pixelanzahl</td><td>ca. 1000 bis 4000 je Seite</td></tr><tr><td>Graustufen</td><td>meist 16 Bit (0–65.535)</td></tr></table><div class="box b"><div class="lbl">Alternative</div><b>Zeilendetektoren</b> messen nur eine Zeile – langsamer, aber mit sehr wenig Streustrahlung.</div>`],
['Belichtungszeit & Mittelung','Mehr Photonen = weniger Rauschen',`<p>Das Rauschen kommt von der Zufälligkeit der Photonen. Das Signal-Rausch-Verhältnis wächst mit der <b>Wurzel</b> der Photonenzahl:</p><div class="formula">SNR ∝ √(Photonen)</div><ul><li>Doppelte Belichtungszeit → SNR × 1,41</li><li>Vierfache Belichtung oder 4-fache Mittelung → SNR × 2</li><li>Die Scanzeit steigt dabei <b>linear</b> mit</li></ul><div class="box g"><div class="lbl">Praxis</div>Erst die Belichtung so einstellen, dass der Detektor gut ausgesteuert ist – dann bei Bedarf mitteln.</div>`],
['Binning','Pixel zusammenfassen',`<p>Beim <b>2×2-Binning</b> werden vier Pixel zu einem zusammengefasst.</p><ul><li><b>Vorteil:</b> 4-faches Signal pro Pixel → SNR × 2, schnelleres Auslesen, kleinere Datenmengen</li><li><b>Nachteil:</b> doppelte Pixelgröße → halbe Auflösung</li></ul><p>Sinnvoll für große Bauteile, bei denen die Voxelgröße sowieso grob ist.</p>`],
['Aussteuerung & Sättigung','Nicht zu dunkel, nicht zu hell',`<p>Jeder Detektorpixel hat einen Maximalwert. Wird er erreicht, ist der Pixel <b>gesättigt</b> – alles darüber ist abgeschnitten.</p><ul><li>Im <b>Bauteil</b> darf nichts gesättigt sein, sonst gehen Informationen verloren</li><li>An der <b>dicksten Stelle</b> sollte noch genug Signal über dem Rauschen ankommen</li><li>Kontrolle über das <b>Histogramm</b> des Projektionsbildes</li></ul>`],
['Kalibrierung: Gain, Offset, Defektpixel','Damit jeder Pixel gleich misst',`<ul><li><b>Offset (Dunkelbild):</b> Signal ohne Strahlung – wird abgezogen</li><li><b>Gain (Hellbild):</b> Bild mit Strahlung ohne Bauteil – gleicht unterschiedliche Empfindlichkeiten aus</li><li><b>Defektpixel-Karte:</b> tote oder überempfindliche Pixel werden aus Nachbarn berechnet</li></ul><div class="box r"><div class="lbl">Wichtig</div>Kalibrierung mit denselben kV, Filter und Belichtung wie der Scan – sonst drohen <b>Ringartefakte</b>.</div>`],
['SNR und CNR','Zwei Zahlen für die Bildqualität',`<div class="formula">SNR = Signal / Rauschen</div><div class="formula">CNR = |Grauwert Material − Grauwert Pore| / Rauschen</div><p>Für die Porenerkennung ist das <b>CNR</b> entscheidend: Eine Pore ist nur sichtbar, wenn sie sich deutlich vom Rauschen abhebt. Als grobe Faustregel gilt ein CNR von mindestens 3–5 für sichere Erkennung.</p>`],
['Was die Auflösung begrenzt','Die schwächste Stelle zählt',`<ul><li><b>Voxelgröße</b> (Detektorpixel / Vergrößerung)</li><li><b>Brennfleck</b> (geometrische Unschärfe)</li><li><b>Detektor-Unschärfe</b> (Licht streut im Szintillator)</li><li><b>Bewegung &amp; Drift</b> während des Scans</li><li><b>Rekonstruktionsfilter</b> (glättend oder scharf)</li></ul><div class="box g"><div class="lbl">Merke</div>Kleine Voxel bringen nichts, wenn der Brennfleck größer ist – die Unschärfe bestimmt dann das Ergebnis.</div>`],
['Nachleuchten (Lag)','Das Gedächtnis des Detektors',`<p>Der Szintillator leuchtet nach einem Bild noch kurz nach. Bei sehr kurzen Belichtungszeiten bleibt ein schwacher „Geist“ des vorherigen Bildes übrig.</p><p>Gegenmittel: etwas längere Belichtung, Bilder nach dem Drehen verwerfen (Skip-Frames), Stop-and-Go statt kontinuierlicher Drehung.</p>`]
]};

S.assistent={t:'Parameter-Assistent',c:'gr',tag:'PRAXIS',d:'Bauteil wählen und Richtwerte für kV, Fokus 0,4 / 1,0 mm, Vorfilter, Voxel und Projektionen bekommen – mit Begründung.',
items:[
['So rechnet der Assistent','Die Logik hinter den Richtwerten',`<ul><li><b>Spannung:</b> An der dicksten Stelle sollen noch ca. 3 % der Strahlung durchkommen. Daraus folgt die nötige mittlere Energie und daraus die kV.</li><li><b>Voxelgröße:</b> Das Bauteil muss beim Drehen komplett ins Messfeld passen.</li><li><b>Brennfleck:</b> 1,0 mm, wenn viel Leistung nötig ist und die Unschärfe trotzdem zur Voxelgröße passt – sonst 0,4 mm.</li><li><b>Vorfilter:</b> je höher die kV, desto dicker der Kupferfilter</li><li><b>Projektionen:</b> abhängig von Detektorbreite und Ziel (Porosität oder Messung)</li></ul>`],
['Faustregeln zum Einrichten','Kurz und praxisnah',`<ul><li>So viel kV wie nötig, so wenig wie möglich – zu hohe kV kosten Kontrast</li><li>Strom erst erhöhen, wenn die kV passen</li><li>Bauteil möglichst <b>schräg</b> stellen – kürzere Wege, weniger Kegelstrahlartefakte</li><li>Halterung aus Schaumstoff oder Kunststoff, möglichst aus dem Strahl</li><li>Röhre vor dem Scan aufwärmen (Drift)</li></ul>`],
['Kontrolle am Projektionsbild','Bevor du auf „Start“ drückst',`<ul><li>Bauteil in <b>allen</b> Drehwinkeln vollständig im Bild? (sonst Abschneide-Artefakte)</li><li>Keine Sättigung im Bauteil</li><li>Dickste Stelle noch deutlich über dem Rauschen</li><li>Freistrahl an mindestens einer Seite sichtbar (hilft der Rekonstruktion)</li></ul>`],
['Typische Fehler beim Einrichten','Und wie man sie vermeidet',`<table class="t"><tr><th>Fehler</th><th>Folge</th></tr><tr><td>Bauteil ragt aus dem Messfeld</td><td>Abschneide-Artefakte, falsche Grauwerte</td></tr><tr><td>Zu wenig Projektionen</td><td>Streifen, feine Poren verschwinden</td></tr><tr><td>Fokus zu groß für die Voxelgröße</td><td>unscharfe Kanten, kleine Poren unsichtbar</td></tr><tr><td>Bauteil nicht fest</td><td>Bewegungsartefakte, Doppelkanten</td></tr><tr><td>Kalibrierung veraltet</td><td>Ringartefakte</td></tr></table>`]
]};

S.messtechnik={t:'Messtechnik',c:'bl',tag:'MODUL 08',d:'CT als Messgerät: Rückführung, VDI/VDE 2630, Temperatur, Messunsicherheit – mit zwei Rechnern.',
items:[
['Rückführung der Voxelgröße','Warum die Skalierung stimmen muss',`<p>Die Voxelgröße ergibt sich aus der Geometrie (Abstände). Schon kleine Fehler bei FOD oder FDD verfälschen <b>alle</b> Längen im Volumen.</p><p>Deshalb wird mit einem <b>kalibrierten Prüfkörper</b> korrigiert, z. B. einem Kugelstab oder einer Kugelplatte, deren Kugelabstände genau bekannt sind.</p><div class="box b"><div class="lbl">Beispiel</div>Voxelgröße um 0,1 % falsch → bei 400 mm Länge ein Fehler von 0,4 mm!</div>`],
['Kenngrößen nach VDI/VDE 2630','Wie gut misst die Anlage?',`<p>Die Richtlinienreihe VDI/VDE 2630 beschreibt u. a., wie die Genauigkeit einer CT-Messanlage geprüft wird (Blatt 1.3). Typische Kenngrößen:</p><table class="t"><tr><th>Kenngröße</th><th>Bedeutung</th></tr><tr><td>Antastabweichung Form (PF)</td><td>wie „rund“ wird eine ideale Kugel gemessen</td></tr><tr><td>Antastabweichung Größe (PS)</td><td>Fehler im Kugeldurchmesser</td></tr><tr><td>Kugelabstandsabweichung (SD)</td><td>Fehler im Abstand zweier Kugelmittelpunkte</td></tr><tr><td>Längenmessabweichung (E)</td><td>Fehler bei Längenmessungen</td></tr></table><p>Der Hersteller gibt dafür Grenzwerte (MPE) an.</p>`],
['Einflussgrößen','Was alles das Messergebnis verändert',`<ul><li><b>Gerät:</b> Brennfleckdrift, Achsen, Detektor</li><li><b>Bauteil:</b> Material, Größe, Durchstrahlungslängen, Oberfläche</li><li><b>Umgebung:</b> Temperatur, Schwingungen</li><li><b>Auswertung:</b> Oberflächenbestimmung, Registrierung, Filter</li><li><b>Bediener:</b> Aufspannung, Parameterwahl</li></ul>`],
['Temperatur','Aluminium dehnt sich deutlich aus',`<div class="formula">ΔL = α · L · ΔT</div><p>Aluminium: <b>α ≈ 23 µm pro Meter und Kelvin</b>. Ein 500-mm-Bauteil, das 2 K wärmer ist, ist schon 23 µm länger.</p><p>Bezugstemperatur für Längenmessungen ist <b>20 °C</b> (ISO 1). Bauteile deshalb vor dem Messen temperieren lassen – frisch aus der Gießerei oder Waschanlage sind sie oft noch warm.</p>`],
['Messunsicherheit','Kein Messwert ohne Unsicherheit',`<p>Jedes Messergebnis hat eine Unsicherheit. Sie wird meist als <b>erweiterte Messunsicherheit U</b> (k = 2, ca. 95 %) angegeben.</p><div class="box g"><div class="lbl">Goldene Regel</div>Die Messunsicherheit sollte höchstens ca. <b>10–20 % der Toleranz</b> betragen – sonst ist die Messung für dieses Merkmal ungeeignet.</div>`],
['Prüfmittelfähigkeit','Ist das Messsystem gut genug?',`<ul><li><b>Verfahren 1</b> (Cg/Cgk): Wiederholmessungen an einem Normal, typische Forderung ≥ 1,33</li><li><b>Verfahren 2/3</b>: Wiederhol- und Vergleichspräzision mit mehreren Teilen (und Prüfern)</li><li><b>Attributive Prüfung</b>: Übereinstimmung von Prüfern, z. B. mit Kappa (→ Modul Prüfplanung)</li></ul><div class="box"><div class="lbl">Hinweis</div>Welche Verfahren und Grenzwerte gelten, regeln eure internen Vorgaben.</div>`],
['Oberfläche & Material','Warum die Kante wandern kann',`<p>Strahlaufhärtung und Streustrahlung verändern die Grauwerte – besonders bei dicken Wänden. Mit einer globalen ISO-50-Schwelle „wandert“ die Oberfläche dann nach innen oder außen.</p><p>Die <b>lokal adaptive</b> Oberflächenbestimmung sucht die Kante an jeder Stelle neu und liefert genauere Maße.</p>`]
]};

S.vgstudio={t:'VGStudio-Praxis',c:'or',tag:'PRAXIS',d:'Der komplette Auswerte-Ablauf Schritt für Schritt – mit Tipps und den häufigsten Fehlern.',
items:[
['Wichtige Einstellungen der Defektanalyse','Was die Ergebnisse am stärksten beeinflusst',`<ul><li><b>Algorithmus:</b> je nach Version z. B. VGEasyPore, VGDefX oder reine Schwelle</li><li><b>Mindestgröße</b> (in Voxeln oder mm³): filtert Rauschen heraus</li><li><b>Wahrscheinlichkeit/Empfindlichkeit:</b> wie sicher ein Defekt sein muss</li><li><b>Analysebereich:</b> ganzes Bauteil, ROI oder Prüfzone</li><li><b>Abstand zur Oberfläche:</b> Poren am Rand richtig erfassen</li></ul><div class="box g"><div class="lbl">Tipp</div>Gleiche Einstellungen als <b>Vorlage</b> speichern – so sind Ergebnisse von Teil zu Teil vergleichbar.</div>`],
['Ergebnisse richtig lesen','Tabelle, Farben, Histogramm',`<ul><li><b>Farbskala</b> nach Volumen oder Durchmesser – Grenzwerte passend zur Prüfanweisung einstellen</li><li><b>Sphärizität</b> hilft: hoch = Gaspore, niedrig = Lunker</li><li>Großer Defekt am Rand? Prüfen, ob es ein echter Defekt oder ein Oberflächenfehler/Artefakt ist</li><li>Immer stichprobenartig im <b>Schnittbild</b> nachsehen</li></ul>`],
['Typische Auswertefehler','Und wie man sie erkennt',`<table class="t"><tr><th>Fehler</th><th>Erkennungszeichen</th></tr><tr><td>Rauschen als Poren erkannt</td><td>viele winzige Defekte, gleichmäßig verteilt</td></tr><tr><td>Artefakte als Defekte</td><td>Defekte entlang Streifen oder Ringen</td></tr><tr><td>Schlechte Registrierung</td><td>Soll-Ist zeigt einseitig rot/blau</td></tr><tr><td>Falsche Oberfläche</td><td>Wanddicken überall zu dünn oder zu dick</td></tr></table>`],
['Daten & Bericht','Nachvollziehbar dokumentieren',`<ul><li>Bauteilnummer / DMC, Datum, Anlage, Scanparameter</li><li>Schnittbilder der kritischen Stellen mit Maßstab</li><li>Defekttabelle mit Grenzwerten und Bewertung</li><li>Projekt speichern, damit die Auswertung später wiederholbar ist</li></ul>`]
]};

S.bauteil3d={t:'3D-Bauteil',c:'li',tag:'INTERAKTIV 3D',d:'Ein Gussteil-Ausschnitt mit Poren zum Drehen – schiebe eine Schnittebene durch und sieh den CT-Schnitt live.',tool:true,items:[]};

S.pruefplanung={t:'Prüfplanung & Bewertung',c:'gd',tag:'MODUL 09',d:'Attributiv prüfen, Prüfzonen, Grenzmuster, Kappa – mit Bewertungs-Simulator und Kappa-Rechner.',
items:[
['Attributiv oder variabel?','Zwei Arten zu prüfen',`<ul><li><b>Attributiv:</b> Ergebnis ist eine Kategorie – i.O. / n.i.O. (z. B. „Pore zu groß“)</li><li><b>Variabel:</b> Ergebnis ist ein Zahlenwert mit Toleranz (z. B. Wanddicke 3,2 mm)</li></ul><p>Porositätsprüfung ist oft attributiv, Soll-Ist und Wanddicke sind variabel.</p>`],
['Prüfzonen & Grenzwerte','Nicht jede Pore ist gleich schlimm',`<p>Eine Pore in einer <b>Dichtfläche</b> oder einem Gewinde ist kritisch, dieselbe Pore in einer dicken, unbearbeiteten Wand oft harmlos. Deshalb werden <b>Prüfzonen</b> mit eigenen Grenzwerten festgelegt (z. B. nach BDG-Richtlinie P 202 in der Zeichnung).</p><ul><li>Maximale Porengröße (Durchmesser oder Volumen)</li><li>Mindestabstand zur (bearbeiteten) Oberfläche</li><li>Maximaler Porenanteil in einem Bereich</li></ul>`],
['Grenzmuster & Referenzteile','Gemeinsames Verständnis schaffen',`<p><b>Grenzmuster</b> sind Teile oder Bilder, die genau an der Grenze zwischen i.O. und n.i.O. liegen. Sie helfen allen Prüfern, gleich zu entscheiden – besonders bei attributiven Merkmalen.</p>`],
['Prüferübereinstimmung (Kappa)','Entscheiden alle gleich?',`<p>Bei attributiven Prüfungen wird geprüft, ob verschiedene Prüfer (oder Prüfer und Referenz) zum gleichen Urteil kommen. Ein gängiges Maß ist <b>Cohens Kappa</b>:</p><div class="formula">κ = (p₀ − pₑ) / (1 − pₑ)</div><p>p₀ = beobachtete Übereinstimmung, pₑ = zufällig erwartete Übereinstimmung. Häufige Faustregel: <b>κ ≥ 0,75 gut</b>, 0,4–0,75 mäßig, darunter schlecht.</p>`],
['Prüfumfang','100 %, Stichprobe, Erstmuster',`<ul><li><b>Erstmuster / Anlauf:</b> intensive Prüfung, oft vollständige Analyse</li><li><b>Serie:</b> Stichprobe nach Prüfplan oder 100 % bei Inline-CT</li><li><b>Auffälligkeiten:</b> Prüfumfang erhöhen, bis die Ursache behoben ist</li></ul>`],
['Rückmeldung an die Gießerei','Damit Fehler nicht wiederkommen',`<ul><li><b>Wo</b> liegen die Defekte? (Bild mit Lage, Prüfzone)</li><li><b>Welche Art?</b> Gas, Lunker, Kernbruch …</li><li><b>Wie oft?</b> Trend über die Zeit, Pareto der häufigsten Fehler</li><li>Gleiche Bauteilposition bei mehreren Teilen = systematische Ursache (Form, Kern, Temperatur)</li></ul>`]
]};

S.modern={t:'Moderne CT',c:'bl',tag:'MODUL 10',d:'Inline-CT, KI-Fehlererkennung, Dual-Energy, Helix, Laminographie und photonenzählende Detektoren.',
items:[
['Inline-CT','CT im Takt der Fertigung',`<p>Die CT steht direkt in der Linie: Roboter legen Bauteile ein, gescannt wird in Sekunden bis wenigen Minuten, die Auswertung läuft automatisch. So kann jedes Teil oder eine hohe Stichprobe geprüft werden.</p><ul><li>Schnelle Scans mit weniger Projektionen</li><li>Automatische Registrierung und Defektanalyse</li><li>Ergebnis direkt an die Fertigungssteuerung</li></ul>`],
['KI-Fehlererkennung','Deep Learning findet Poren',`<p>Neuronale Netze werden mit vielen markierten CT-Daten trainiert und erkennen danach Defekte auch bei Rauschen und Artefakten.</p><div class="box gr"><div class="lbl">Vorteile</div>Weniger Fehlalarme, schneller, auch bei schwierigen Daten</div><div class="box r"><div class="lbl">Grenzen</div>Die KI erkennt nur, was in den Trainingsdaten vorkam. Neue Fehlerarten oder andere Bauteile brauchen neues Training – und Ergebnisse müssen nachvollziehbar bleiben.</div>`],
['Dual-Energy-CT','Zwei Spektren, mehr Information',`<p>Das Bauteil wird mit zwei verschiedenen Spektren aufgenommen (z. B. niedrige und hohe kV). Weil Materialien je nach Energie unterschiedlich schwächen, lassen sich Materialien besser <b>trennen</b> – z. B. Kunststoff und Metall in Mehrmaterialbauteilen.</p>`],
['Helix-CT','Schraubenförmige Bahn',`<p>Das Bauteil dreht sich und fährt gleichzeitig nach oben. Die Strahlung beschreibt eine Schraubenbahn um das Bauteil.</p><ul><li>Keine Kegelstrahlartefakte</li><li>Ideal für <b>lange</b> Bauteile</li></ul>`],
['Laminographie','Für flache Bauteile',`<p>Bei flachen, großen Bauteilen (z. B. Leiterplatten, Batteriemodule) wäre die Durchstrahlung längs der Fläche viel zu lang. Bei der Laminographie wird schräg durchstrahlt – das Bauteil muss sich nicht komplett drehen.</p>`],
['Photonenzählende Detektoren','Jedes Photon einzeln',`<p>Statt Licht zu sammeln, zählen diese Detektoren jedes Photon einzeln und messen seine <b>Energie</b>. Das ermöglicht spektrale CT, weniger Rauschen und bessere Materialtrennung. In der Medizin seit 2021 im klinischen Einsatz, in der Industrie im Kommen.</p>`],
['Schnelle & KI-Rekonstruktion','Mit weniger Projektionen auskommen',`<p>Iterative Verfahren und KI-gestützte Rekonstruktion liefern auch mit wenigen Projektionen brauchbare Bilder – wichtig für Inline-CT mit kurzer Taktzeit.</p>`],
['Simulation & digitaler Zwilling','Scannen am Computer',`<p>CT-Simulationen (z. B. das Programm aRTist der BAM) berechnen vorab, wie ein Bauteil im CT aussehen wird. So lassen sich Parameter und Aufspannung planen, bevor die Anlage belegt wird.</p>`]
]};

const FACTS=[
'Das erste Röntgenbild eines Menschen zeigt die Hand von Anna Bertha Röntgen – mit Ehering, aufgenommen am 22. Dezember 1895.',

/* ============== Router ============== */
let runId=0;
const app=document.getElementById('app');
function go(h){location.hash=h?h:'start';}
window.addEventListener('hashchange',render);
function setAc(c){document.documentElement.style.setProperty('--ac',V[c]||V.gr);}
/* Hell / Dunkel / Auto */
const mq=window.matchMedia?matchMedia('(prefers-color-scheme: light)'):null;
function applyTheme(){const m=store.theme||'auto';const t=m==='auto'?(mq&&mq.matches?'light':'dark'):m;document.documentElement.dataset.theme=t;const mt=document.querySelector('meta[name=theme-color]');if(mt)mt.content=t==='light'?'#f2f5f9':'#05080d';document.querySelectorAll('.theme button').forEach(b=>b.classList.toggle('on',b.dataset.th===m));}
function themeCtl(){return `<div class="theme" role="group" aria-label="Darstellung">${[['dark','☾ DUNKEL'],['light','☀ HELL'],['auto','◐ AUTO']].map(t=>`<button data-th="${t[0]}" class="${(store.theme||'auto')===t[0]?'on':''}">${t[1]}</button>`).join('')}</div>`;}
document.addEventListener('click',e=>{const b=e.target.closest('.theme button');if(!b)return;store.theme=b.dataset.th;save();applyTheme();});
if(mq){const f=()=>{if((store.theme||'auto')==='auto')applyTheme();};mq.addEventListener?mq.addEventListener('change',f):mq.addListener(f);}
applyTheme();

function progressOf(id){const s=S[id];if(!s.items.length)return null;let d=0;s.items.forEach((_,i)=>{if(store.done[id+'-'+i])d++});return [d,s.items.length];}
function totalProgress(){let d=0,n=0;ORDER.forEach(id=>{const p=progressOf(id);if(p){d+=p[0];n+=p[1];}});return [d,n];}

function render(){
  runId++;
  const h=(location.hash||'').replace('#','');
  window.scrollTo(0,0);
  if(S[h]) page(h); else home();
}

/* ============== Startseite ============== */
function home(){
  setAc('gr');
  const [d,n]=totalProgress();const pct=Math.round(d/n*100);
  let fi=Math.floor(Math.random()*FACTS.length);
  let html=`<div class="hero fx"><div class="top"><div class="sub"><span class="dot"></span>Lern-Terminal · Röntgen &amp; CT</div>${themeCtl()}</div>
  <h1>Bayazit <span>CT-Schule</span></h1><p>Alles über Röntgentechnik und Computertomographie – von der Röhre bis zur Porositätsanalyse. Mit Animationen, Rechnern, Simulation und Quiz.</p></div>
  <div class="prog fx" style="--i:1"><div class="row"><span>LERNFORTSCHRITT</span><span><b>${d}</b> / ${n} LERNKARTEN · ${pct} %</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>
  <div class="fact fx" style="--i:2"><div style="flex:1"><div class="lbl">⚡ Wusstest du?</div><p id="fact">${FACTS[fi]}</p></div><button id="nf">NÄCHSTE ›</button></div>
  <div class="grid">`;
  ORDER.forEach((id,k)=>{
    const s=S[id];const p=progressOf(id);
    let foot;
    if(p){foot=`<span>${p[0]}/${p[1]}${p[0]===p[1]?' <span class="check">✓</span>':''}</span><div class="bar"><i style="width:${p[0]/p[1]*100}%"></i></div>`;}
    else if(id==='quiz'){const bq=Math.max(0,...Object.values(store.bests||{}));foot=`<span>${QZ.length} FRAGEN · BEST ${bq} %</span><div class="bar"><i style="width:${bq}%"></i></div>`;}
    else if(id==='lexikon'){foot=`<span>${LEX.length} BEGRIFFE</span><div class="bar"><i style="width:100%"></i></div>`;}
    else if(id==='geschichte'){foot=`<span>${TL.length} MEILENSTEINE</span><div class="bar"><i style="width:100%"></i></div>`;}
    else foot=`<span>INTERAKTIV</span><div class="bar"><i style="width:100%"></i></div>`;
    if(id==='detektiv'){foot=`<span>${p[0]}/${p[1]} · SPIEL</span><div class="bar"><i style="width:${p[0]/p[1]*100}%"></i></div>`;}
    html+=`<button class="tile fx ${WIDE[id]?'wide':''}" style="--i:${k+3};--ac:${V[s.c]}" onclick="go('${id}')">${ico(id)}<div class="tag">${s.tag}</div><h3>${s.t}</h3><p>${s.d}</p><div class="tfoot">${foot}<span class="arr">›</span></div></button>`;
  });
  html+=`</div><footer>BAYAZIT CT-SCHULE · LERNSTAND WIRD NUR IN DIESEM BROWSER GESPEICHERT</footer>`;
  app.innerHTML=html;
  document.getElementById('nf').onclick=()=>{fi=(fi+1)%FACTS.length;const f=document.getElementById('fact');f.style.opacity=0;setTimeout(()=>{f.textContent=FACTS[fi];f.style.opacity=1},200);};
  document.getElementById('fact').style.transition='opacity .2s';
}

/* ============== Unterseite ============== */
function page(id){
  const s=S[id];setAc(s.c);
  const p=progressOf(id);
  let meta=p?`${p[1]} LERNKARTEN · ${p[0]} ERLEDIGT`:s.tag;
  let html=`<div class="top fx"><button class="back" onclick="go('')">‹ ZURÜCK</button>${themeCtl()}</div>
  <div class="phead fx" style="--i:1"><div class="sub" id="meta">${meta}</div><h2>${s.t}</h2><p>${s.d}</p></div>`;
  html+=`<div id="extra"></div>`;
  if(s.items.length){
    html+=`<div class="sec fx" style="--i:3">Lernkarten</div><div class="items">`;
    s.items.forEach((it,i)=>{
      const key=id+'-'+i;const done=store.done[key];
      let body=it[2];
      body=body.replace(/ART:(\w+)/,(m,a)=>artSvg(a));
      html+=`<div class="item fx ${done?'done':''}" style="--i:${i+4}" data-k="${key}">
       <button class="ihead"><span class="num">${done?'✓':String(i+1).padStart(2,'0')}</span><span class="tt"><b>${it[0]}</b><small>${it[1]}</small></span><span class="chev">›</span></button>
       <div class="ibody"><div><div class="in">${body}<button class="mark">${done?'✓ GELERNT':'ALS GELERNT MARKIEREN'}</button></div></div></div></div>`;
    });
    html+=`</div>`;
  }
  const idx=ORDER.indexOf(id);const nx=ORDER[(idx+1)%ORDER.length];
  html+=`<div class="next"><button class="btn ghost" onclick="go('')">‹ Übersicht</button><button class="btn" style="--ac:${V[S[nx].c]}" onclick="go('${nx}')">Weiter: ${S[nx].t} ›</button></div>`;
  app.innerHTML=html;
  app.querySelectorAll('.item').forEach(el=>{
    el.querySelector('.ihead').onclick=()=>el.classList.toggle('open');
    el.querySelector('.mark').onclick=()=>{
      const k=el.dataset.k;store.done[k]=!store.done[k];save();
      el.classList.toggle('done',!!store.done[k]);
      el.querySelector('.num').textContent=store.done[k]?'✓':String(+k.split('-')[1]+1).padStart(2,'0');
      el.querySelector('.mark').textContent=store.done[k]?'✓ GELERNT':'ALS GELERNT MARKIEREN';
      const q=progressOf(id);document.getElementById('meta').textContent=`${q[1]} LERNKARTEN · ${q[0]} ERLEDIGT`;
    };
  });
  const ex=document.getElementById('extra');
  if(EXTRA[id]) EXTRA[id](ex);
}

/* ============== Hilfen ============== */
function cvs(c,h){const dpr=Math.min(window.devicePixelRatio||1,2);const w=c.clientWidth;c.width=w*dpr;c.height=h*dpr;c.style.height=h+'px';const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);return [x,w,h];}
function pillC(x,t,px,py,col,align){x.font='700 11px "JetBrains Mono",monospace';const w=x.measureText(t).width+14;let lx=align==='r'?px-w:align==='c'?px-w/2:px;x.fillStyle='#070b11';x.strokeStyle=col;x.lineWidth=1;rr(x,lx,py-10,w,20,10);x.fill();x.stroke();x.fillStyle=col;x.textBaseline='middle';x.fillText(t,lx+7,py+.5);}
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}
function pillS(x,y,t,col,anchor){const w=t.length*7.2+14;const lx=anchor==='e'?x-w:anchor==='m'?x-w/2:x;return `<g><rect x="${lx}" y="${y-10}" width="${w}" height="20" rx="10" fill="#070b11" stroke="${col}"/><text x="${lx+w/2}" y="${y+4}" fill="${col}" font-family="JetBrains Mono,monospace" font-size="11" font-weight="700" text-anchor="middle">${t}</text></g>`;}
const fmt=(v,d=1)=>v.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function grid(x,l,t,w,h,nx,ny){x.strokeStyle='#1b2532';x.setLineDash([3,4]);x.lineWidth=1;for(let i=0;i<=nx;i++){const X=l+w*i/nx;x.beginPath();x.moveTo(X,t);x.lineTo(X,t+h);x.stroke();}for(let j=0;j<=ny;j++){const Y=t+h*j/ny;x.beginPath();x.moveTo(l,Y);x.lineTo(l+w,Y);x.stroke();}x.setLineDash([]);}

/* ============== Artefakt-Bilder ============== */
function artSvg(a){
  const g=(inner)=>`<svg class="svgfig" viewBox="0 0 320 130" style="max-width:420px;margin:0 0 12px;background:#070b11;border:1px solid #1b2532;border-radius:12px">${inner}</svg>`;
  const disc=(fill)=>`<circle cx="80" cy="65" r="48" fill="${fill}"/>`;
  switch(a){
  case 'cup':return g(`<defs><radialGradient id="cg"><stop offset="0" stop-color="#5d6672"/><stop offset=".75" stop-color="#9aa4b1"/><stop offset="1" stop-color="#d8dee6"/></radialGradient></defs>${disc('url(#cg)')}<line x1="32" y1="65" x2="128" y2="65" stroke="${C.rd}" stroke-dasharray="4 3"/><path d="M175 30 Q 205 30 215 70 Q 240 100 265 70 Q 275 30 305 30" fill="none" stroke="${C.rd}" stroke-width="2.5" style="filter:drop-shadow(0 0 4px ${C.rd})"/><line x1="175" y1="30" x2="305" y2="30" stroke="${C.gr}" stroke-dasharray="4 3"/>${pillS(240,115,'PROFIL: CUPPING',C.rd,'m')}${pillS(240,16,'SOLL',C.gr,'m')}`);
  case 'streak':return g(`${disc('#9aa4b1')}<circle cx="60" cy="55" r="9" fill="#f2f5f8"/><circle cx="102" cy="78" r="9" fill="#f2f5f8"/><path d="M60 55 L102 78" stroke="#2a313a" stroke-width="7"/><path d="M40 30 L120 100 M30 60 L130 70" stroke="#3a424d" stroke-width="2" opacity=".7"/>${pillS(170,40,'STAHLEINSÄTZE',C.gr,'s')}${pillS(170,80,'DUNKLER STREIFEN',C.rd,'s')}`);
  case 'ring':return g(`${disc('#9aa4b1')}<circle cx="80" cy="65" r="14" fill="none" stroke="#e8edf3" stroke-width="1.5"/><circle cx="80" cy="65" r="27" fill="none" stroke="#4b535e" stroke-width="1.5"/><circle cx="80" cy="65" r="36" fill="none" stroke="#e8edf3" stroke-width="1"/><circle cx="80" cy="65" r="2" fill="${C.gd}"/>${pillS(170,45,'RINGE UM DREHACHSE',C.rd,'s')}${pillS(170,85,'DREHACHSE',C.gd,'s')}`);
  case 'cone':return g(`<path d="M20 65 L130 15 L130 115 Z" fill="${C.bl}" opacity=".12" stroke="${C.bl}" stroke-dasharray="4 3"/><circle cx="20" cy="65" r="4" fill="${C.gd}"/><rect x="62" y="30" width="38" height="70" rx="3" fill="#9aa4b1"/><line x1="20" y1="65" x2="130" y2="65" stroke="${C.gr}" stroke-width="1.5" style="filter:drop-shadow(0 0 3px ${C.gr})"/><rect x="62" y="30" width="38" height="8" fill="${C.rd}" opacity=".6"/><rect x="62" y="92" width="38" height="8" fill="${C.rd}" opacity=".6"/>${pillS(150,65,'MITTELEBENE = OK',C.gr,'s')}${pillS(150,30,'RAND = VERWASCHEN',C.rd,'s')}`);
  case 'motion':return g(`<rect x="40" y="25" width="70" height="80" rx="8" fill="none" stroke="#9aa4b1" stroke-width="3"/><rect x="47" y="29" width="70" height="80" rx="8" fill="none" stroke="#9aa4b1" stroke-width="2" opacity=".45"/>${pillS(150,50,'DOPPELTE KANTE',C.rd,'s')}${pillS(150,85,'BAUTEIL HAT GEWACKELT',C.mut||'#7f8b9c','s')}`);
  case 'scatter':return g(`<rect x="10" y="20" width="140" height="90" fill="#2b323c"/>${disc('#7b8492')}<circle cx="80" cy="65" r="14" fill="#3b434e"/><rect x="170" y="20" width="140" height="90" fill="#070b11"/><circle cx="240" cy="65" r="48" fill="#b7c0cc"/><circle cx="240" cy="65" r="14" fill="#070b11"/>${pillS(80,120,'MIT STREUUNG',C.rd,'m')}${pillS(240,120,'OHNE',C.gr,'m')}`);
  case 'noise':{let r='';for(let i=0;i<500;i++){const ang=Math.random()*6.28,rad=Math.sqrt(Math.random())*46;const v=150+Math.floor(gauss()*45);r+=`<rect x="${(80+Math.cos(ang)*rad).toFixed(1)}" y="${(65+Math.sin(ang)*rad).toFixed(1)}" width="2.2" height="2.2" fill="rgb(${v},${v+6},${v+14})"/>`;}return g(`<circle cx="80" cy="65" r="48" fill="#7b8492"/>${r}<circle cx="100" cy="55" r="4" fill="#3b434e" opacity=".7"/>${pillS(150,50,'KLEINE PORE?',C.gd,'s')}${pillS(150,85,'GEHT IM RAUSCHEN UNTER',C.rd,'s')}`);}
  case 'pve':{let r='';for(let i=0;i<8;i++)for(let j=0;j<8;j++){const cx=i-3.5,cy=j-3.5;const d=Math.hypot(cx,cy);const v=d<1.6?40:d<2.3?110:180;r+=`<rect x="${30+i*13}" y="${13+j*13}" width="12" height="12" fill="rgb(${v},${v+6},${v+14})"/>`;}return g(`${r}<circle cx="82" cy="65" r="24" fill="none" stroke="${C.gd}" stroke-dasharray="3 3"/>${pillS(160,45,'ECHTE PORE',C.gd,'s')}${pillS(160,85,'RANDVOXEL = GRAU',C.rd,'s')}`);}
  }
  return '';
}

   ${[-22,-8,6,20].map((a,i)=>`<path d="M256 88 l${-8+a*.6} 105" stroke="${C.li}" stroke-width="2" fill="none" stroke-dasharray="6 6" filter="url(#gl)" opacity=".9"><animate attributeName="stroke-dashoffset" values="24;0" dur=".6s" repeatCount="indefinite" begin="${i*.1}s"/></path>`).join('')}
   <rect x="215" y="195" width="80" height="10" rx="3" fill="#1b2532" stroke="${C.gr}"/>
   ${pillS(75,24,'KATHODE (−)',C.bl,'m')}${pillS(280,24,'ANODE (+) WOLFRAM',C.gd,'m')}
   ${pillS(172,150,'ELEKTRONEN',C.bl,'m')}${pillS(140,172,'RÖNTGENSTRAHLUNG',C.li,'m')}${pillS(310,215,'BAUTEIL',C.gr,'m')}
  </svg><div class="hint" style="margin:6px 0 0">Die Glühwendel gibt Elektronen ab, die Hochspannung beschleunigt sie zur Anode. Beim Aufprall entsteht Röntgenstrahlung – und viel Wärme.</div></div>
  <div class="sec fx" style="--i:3">Live · Röntgenspektrum</div>
  <div class="panel fx" style="--i:3"><h3>Spektrum einer Wolfram-Röhre</h3><div class="hint">Verändere Spannung, Strom und Vorfilter und beobachte das Spektrum (vereinfachtes Modell).</div>
   <canvas id="spc"></canvas><div class="pills" id="spp"></div>
   <div class="ctl"><div><label>Brennfleck</label><div class="seg" id="foc"><button data-v="0.4" class="on">0,4 MM · MAX 700 W</button><button data-v="1.0">1,0 MM · MAX 1500 W</button></div></div>
   <div><label>Spannung <b id="kvv"></b></label><input type="range" id="kv" min="40" max="450" value="225"></div>
   <div><label>Strom <b id="mav"></b></label><input type="range" id="ma" min="1" max="40" value="15"></div>
   <div><label>Vorfilter</label><div class="seg" id="flt"><button data-v="0" class="on">KEINER</button><button data-v="0.05">0,5 MM CU</button><button data-v="0.1">1 MM CU</button><button data-v="0.2">2 MM CU</button><button data-v="0.4">4 MM CU</button></div></div></div>
   <div class="fb" id="spw" style="margin-top:12px"></div></div>`;
  const c=document.getElementById('spc');let F=0,FOC=0.4;
  function draw(){
    const kv=+document.getElementById('kv').value;const Pmax=FOC<0.5?700:1500;
    const maMax=Math.min(4,Pmax/kv);let ma=+document.getElementById('ma').value/10;const capped=ma>maMax;if(capped)ma=maMax;
    document.getElementById('kvv').textContent=kv+' kV';document.getElementById('mav').textContent=fmt(ma,2)+' mA'+(capped?' (Grenze)':'');
    const [x,w,h]=cvs(c,230);const L=38,R=10,T=14,B=30,W=w-L-R,H=h-T-B;
    x.clearRect(0,0,w,h);grid(x,L,T,W,H,9,4);
    const Emax=450;const pts=[];let sum=0,sumE=0,peak=0;
    const spec=(E,kv,ma)=>{let I=E<kv?(kv-E)*ma:0;const muAl=2.66*Math.pow(30/E,3)+0.39*Math.pow(100/E,0.35),muCu=100*Math.pow(30/E,3)+1.4*Math.pow(100/E,0.35);const att=Math.exp(-muAl*0.2)*Math.exp(-muCu*F);I*=att;if(kv>69.5){const k=Math.pow((kv-69.5)/100,1.2)*ma*60*att;I+=k*Math.exp(-Math.pow((E-59.3)/0.9,2))+0.35*k*Math.exp(-Math.pow((E-67.2)/0.9,2));}return I;};
    let ymax=1;for(let E=5;E<=Emax;E+=1)ymax=Math.max(ymax,spec(E,kv,maMax));ymax*=1.12;

    x.beginPath();x.moveTo(L,T+H);
    pts.forEach(([E,I])=>{x.lineTo(L+W*E/Emax,T+H-Math.min(I/ymax,1.05)*H);});
    x.lineTo(L+W,T+H);x.closePath();
    const gr=x.createLinearGradient(0,T,0,T+H);gr.addColorStop(0,'rgba(76,154,255,.45)');gr.addColorStop(1,'rgba(76,154,255,.02)');x.fillStyle=gr;x.fill();
    x.beginPath();pts.forEach(([E,I],i)=>{const X=L+W*E/Emax,Y=T+H-Math.min(I/ymax,1.05)*H;i?x.lineTo(X,Y):x.moveTo(X,Y);});
    x.strokeStyle=C.bl;x.lineWidth=2;x.shadowColor=C.bl;x.shadowBlur=8;x.stroke();x.shadowBlur=0;
    const Xk=L+W*kv/Emax;x.strokeStyle=C.rd;x.setLineDash([4,4]);x.beginPath();x.moveTo(Xk,T);x.lineTo(Xk,T+H);x.stroke();x.setLineDash([]);
    pillC(x,'E_max '+kv+' keV',Xk<150?Xk+4:Xk-4,T+10,C.rd,Xk<150?'l':'r');
